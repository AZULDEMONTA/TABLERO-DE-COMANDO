<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tablero de Comando</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
/* Estilo "Sala de control": fondo oscuro, acento verde lima, números monoespaciados. */
:root {
  color-scheme: dark;
  --fondo: #0D1117;
  --tarjeta: #151B23;
  --suave: #0F141B;
  --tinta: #E6EDF3;
  --tenue: #9AA7B5;
  --gris: #9AA7B5;
  --borde: #242C38;
  --linea: #1C232D;
  --pista: #242C38;
  --acento: #C6F432;
  --acento-claro: #3B4757;
  --acento-suave: rgba(198, 244, 50, .12);
  --ambar: #FFB547;
  --coral: #FF8A7A;
  --mono: 'DM Mono', ui-monospace, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--fondo); }
body { font-family: 'Space Grotesk', system-ui, sans-serif; color: var(--tinta); -webkit-font-smoothing: antialiased; }
.pagina { max-width: 1240px; margin: 0 auto; padding-block: 40px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 24px; }
.mono { font-family: var(--mono); }
h1, h2, h3 { margin: 0; }

.cabecera { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px; }
.cabecera .sup { font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: var(--acento); }
.cabecera h1 { font-size: 36px; font-weight: 700; letter-spacing: -.02em; margin-top: 6px; }
.controles { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; font-family: var(--mono); font-size: 13px; color: var(--tenue); }
.controles select, .controles button {
  font: inherit; color: var(--tinta); background: var(--tarjeta);
  border: 1px solid #2A3340; border-radius: 6px; padding: 9px 12px; min-height: 40px;
}
.controles button { cursor: pointer; color: var(--acento); }
.controles button:hover, .controles select:hover { border-color: var(--acento); }
.pastilla { border: 1px solid #2A3340; border-radius: 6px; padding: 9px 12px; }

.tarjeta { background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 8px; padding: 28px; display: flex; flex-direction: column; gap: 22px; }
.titulo-sec { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
.titulo-sec h2 { font-size: 14px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--tenue); }
.titulo-sec .nota { font-family: var(--mono); font-size: 13px; color: var(--tenue); }
.etiqueta { font-size: 12px; font-weight: 600; border: 1px solid currentColor; border-radius: 999px; padding: 4px 12px; }
.ok { color: var(--acento); }
.warn { color: var(--ambar); }
.bad { color: var(--coral); }

.fila { display: flex; flex-wrap: wrap; gap: 16px; }
.kpi { flex: 1 1 240px; background: var(--suave); border: 1px solid transparent; border-radius: 6px; padding: 20px; display: flex; flex-direction: column; gap: 8px; }
.kpi.destacado { border-color: var(--acento); }
.kpi.destacado .rot { color: var(--acento); }
.rot { font-size: 13px; color: var(--tenue); }
.sub { font-size: 13px; color: var(--tenue); }
.num { font-family: var(--mono); font-weight: 500; letter-spacing: -.02em; }
.n34 { font-size: 40px; }
.n52 { font-size: 64px; line-height: 1; letter-spacing: -.03em; }
.n26 { font-size: 26px; }
.n30 { font-size: 28px; }
.n38 { font-size: 38px; }
.n20 { font-size: 22px; }
.n24 { font-size: 24px; }

.col-div { flex: 1 1 180px; display: flex; flex-direction: column; gap: 4px; }
.col-grande { flex: 2 1 300px; display: flex; flex-direction: column; gap: 4px; }
.col-div .pe, .pe { color: var(--ambar); }

.barra { position: relative; height: 10px; background: var(--pista); border-radius: 2px; }
.barra.alta { height: 18px; }
.barra .relleno { position: absolute; left: 0; top: 0; bottom: 0; background: var(--acento); border-radius: 2px; min-width: 3px; }
.barra .marca { position: absolute; top: -6px; bottom: -6px; width: 3px; margin-left: -1px; }
.barra .marca.hoy { background: var(--tinta); width: 2px; }
.barra .marca.pe { background: var(--ambar); top: -8px; bottom: -8px; }
.barra .marca.obj { background: var(--tinta); top: -8px; bottom: -8px; }
.barra .marca.proy { width: 0; border-left: 2px dashed var(--tenue); top: 0; bottom: 0; background: none; }
.leyenda { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; font-family: var(--mono); font-size: 12px; text-transform: uppercase; color: var(--tenue); }
.leyenda b { color: var(--tinta); font-weight: 500; }
.sw { display: inline-block; width: 10px; height: 10px; margin-right: 6px; vertical-align: 0; }

.ritmo { display: flex; flex-direction: column; gap: 10px; }
.ritmo .tit { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--acento); }
.ritmo .fila { gap: 1px; background: var(--borde); border: 1px solid var(--borde); border-radius: 6px; overflow: hidden; }
.ritmo .item { flex: 1 1 200px; background: var(--tarjeta); padding: 16px 18px; display: flex; flex-direction: column; gap: 4px; }
.ritmo .item .rot, .ritmo .item .sub { font-size: 12px; }
.neg { color: var(--coral); }
.pos { color: var(--acento); }

/* Comparativa anual */
.graf-scroll { overflow-x: auto; }
.graf { min-width: 640px; display: flex; flex-direction: column; gap: 8px; }
.graf .barras { display: flex; align-items: flex-end; gap: 12px; height: 240px; border-bottom: 1px solid #2A3340; padding: 0 4px; }
.graf .mes { flex: 1 1 0; display: flex; align-items: flex-end; justify-content: center; gap: 3px; height: 100%; }
.graf .b { width: 40%; position: relative; }
.graf .b.ant { background: var(--acento-claro); }
.graf .b.act { background: var(--acento); }
.graf .pila { width: 40%; height: 100%; position: relative; }
.graf .pila .b { position: absolute; left: 0; right: 0; bottom: 0; width: auto; }
.graf .pila .proy { position: absolute; left: 0; right: 0; bottom: 0; border: 2px dashed var(--acento); border-bottom: none; background: transparent; }
.graf .etis { display: flex; gap: 12px; padding: 0 4px; }
.graf .etis span { flex: 1 1 0; text-align: center; font-family: var(--mono); font-size: 12px; text-transform: uppercase; color: var(--tenue); }
.graf .vars { display: flex; gap: 12px; padding: 0 4px; }
.graf .vars span { flex: 1 1 0; text-align: center; font-size: 11px; font-family: var(--mono); }

/* Situación financiera */
.sec-fin { display: flex; flex-direction: column; gap: 16px; }
.sec-fin > .titulo-sec { padding: 8px 4px 0; }
.mini { flex: 1 1 260px; background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 8px; padding: 18px 20px; display: flex; flex-direction: column; gap: 6px; }
.tramos-barra { display: flex; height: 14px; border-radius: 2px; overflow: hidden; gap: 2px; background: var(--pista); }
.tramo { flex: 1 1 200px; display: flex; flex-direction: column; gap: 4px; border-top: 3px solid; padding-top: 10px; }
.tabla { flex: 1 1 400px; background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 8px; padding: 8px 24px 16px; }
.tabla .enc { padding: 14px 0; border-bottom: 1px solid var(--borde); font-size: 13px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--tenue); }
.tabla .reng { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--linea); font-size: 14px; }
.tabla .reng .num { font-weight: 400; white-space: nowrap; }
.tabla .tot { display: flex; justify-content: space-between; padding: 14px 0 4px; font-weight: 700; font-size: 15px; }
.tag { font-size: 11px; color: var(--acento); background: var(--acento-suave); border-radius: 4px; padding: 2px 6px; margin-left: 8px; white-space: nowrap; }
.bal { flex: 1 1 400px; background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 8px; padding: 22px 24px; display: flex; flex-direction: column; gap: 6px; }
.bal .cab { display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: 600; }
.rojo { color: var(--coral); }

.aviso { background: rgba(255, 181, 71, .1); border: 1px solid rgba(255, 181, 71, .4); color: var(--ambar); border-radius: 6px; padding: 12px 16px; font-size: 13px; }
.error { background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 8px; padding: 28px; display: flex; flex-direction: column; gap: 12px; }
.error b { color: var(--coral); }
.vacio { font-size: 14px; color: var(--tenue); }
.pie { font-family: var(--mono); font-size: 12px; color: var(--tenue); text-align: center; }

/* Bloques con el formato de VentasTrack */
:root { --vendido: #7AA2FF; --facturado: #C6F432; --facturable: #B794F6; }
.c-ok { color: var(--acento); }
.c-warn { color: var(--ambar); }
.c-bad { color: var(--coral); }
.c-mes { color: var(--vendido); }
.relleno.c-ok { background: var(--acento); }
.relleno.c-warn { background: var(--ambar); }
.relleno.c-bad { background: var(--coral); }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.k { background: var(--suave); border: 1px solid var(--borde); border-radius: 6px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.k.b-ok { border-color: rgba(198, 244, 50, .35); }
.k.b-bad { border-color: rgba(255, 138, 122, .4); }
.k.k-ancho { grid-column: span 2; }
.k-rot { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--tenue); }
.k-val { font-family: var(--mono); font-size: 22px; font-weight: 500; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.k-val.pe { color: var(--ambar); }
.k-sub { font-size: 12px; color: var(--tenue); }
.avance { background: var(--suave); border: 1px solid var(--borde); border-radius: 6px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; }
.avance .titulo-sec b { font-size: 15px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--tenue); }
.chips b { font-family: var(--mono); font-weight: 500; color: var(--tinta); }
.chips b.c-ok { color: var(--acento); } .chips b.c-warn { color: var(--ambar); } .chips b.c-bad { color: var(--coral); }
.composicion { display: flex; height: 12px; border-radius: 2px; overflow: hidden; gap: 2px; background: var(--pista); }
.bf { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.bf > div { background: var(--suave); border-radius: 6px; border-left: 3px solid; padding: 12px 14px; display: flex; flex-direction: column; gap: 3px; }
.vend { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 12px; }
.v { background: var(--suave); border: 1px solid var(--borde); border-left: 3px solid; border-radius: 6px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.v-cab { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.v-cab > div:first-child { display: flex; flex-direction: column; gap: 2px; }
.v-der { display: flex; align-items: center; gap: 12px; text-align: right; }
.infl { display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 13px; color: var(--tenue); }
.infl input { width: 76px; font: inherit; color: var(--tinta); background: var(--suave); border: 1px solid var(--acento); border-radius: 6px; padding: 8px 10px; min-height: 40px; text-align: right; }
.graf3 .mes { gap: 2px; }
.graf3 .b, .graf3 .pila { width: 28%; }
.graf .b.aj { background: var(--ambar); }
.graf .vars em { flex: 0 0 64px; font-style: normal; font-size: 11px; color: var(--tenue); text-align: left; }
.graf .vars { padding-left: 0; }
.graf3 .etis { padding-left: 76px; }
.graf3 .barras { padding-left: 76px; }
@media (max-width: 640px) { .k.k-ancho { grid-column: auto; } .vend { grid-template-columns: 1fr; } }

@media (max-width: 640px) {
  .tarjeta { padding: 20px; }
  .n52 { font-size: 44px; }
  .n34 { font-size: 30px; }
}

/* ---------- Tablero unificado: titular, cambios de la semana, semáforo por área y detalle ---------- */
:root { --verde: #C6F432; --amarillo: #FFB547; --rojo: #FF5C5C; --apagado: #2A3340; }
.s-verde { --s: var(--verde); } .s-amarillo { --s: var(--amarillo); } .s-rojo { --s: var(--rojo); } .s-gris { --s: #5B6675; }
.foco { width: 10px; height: 10px; border-radius: 50%; background: var(--s); display: inline-block; flex: none; }
.pie a { color: var(--tenue); }
.pie a:hover { color: var(--acento); }

/* Titular */
.titular { display: grid; grid-template-columns: minmax(280px, 1.3fr) repeat(2, minmax(0, 1fr)); gap: 1px; background: var(--borde); border: 1px solid var(--borde); }
.titular > div { background: var(--tarjeta); padding: 20px 22px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.titular .estado { border-left: 4px solid var(--s); flex-direction: row; align-items: center; gap: 18px; }
.estado-txt { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.estado-txt h2 { font-size: 24px; font-weight: 700; color: var(--s); text-wrap: balance; }
.estado-txt p { margin: 0; font-size: 13px; color: var(--tenue); line-height: 1.45; }
.semaforo { display: flex; flex-direction: column; gap: 6px; background: #0A0E13; border: 1px solid var(--borde); border-radius: 12px; padding: 8px; flex: none; }
.semaforo i { width: 20px; height: 20px; border-radius: 50%; background: var(--apagado); }
.semaforo.on-r .l-r { background: var(--rojo); } .semaforo.on-a .l-a { background: var(--amarillo); } .semaforo.on-v .l-v { background: var(--verde); }
.cuentas { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--tenue); margin-top: 2px; }
.cuentas span { display: inline-flex; align-items: center; gap: 6px; }
.cuentas .foco { width: 8px; height: 8px; }
.preg { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--tenue); }
.big { font-family: var(--mono); font-size: 40px; font-weight: 500; letter-spacing: -.03em; color: var(--s); line-height: 1; }
.tit-sub { font-size: 13px; color: var(--tenue); line-height: 1.45; }
.tit-pie { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--s); font-weight: 600; }
.tit-pie .foco { width: 8px; height: 8px; }

/* Qué cambió */
.cambios { background: var(--tarjeta); border: 1px solid var(--borde); padding: 16px 20px; display: flex; flex-direction: column; gap: 12px; }
.cab-linea { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; }
.cab-linea h2 { font-size: 13px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; }
.cab-linea .nota { font-size: 12px; color: var(--tenue); font-family: var(--mono); }
.cambios ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; }
.cambios li { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; line-height: 1.4; background: var(--suave); padding: 10px 12px; min-width: 0; }
.cambios li .fl { font-family: var(--mono); color: var(--s); flex: none; width: 14px; text-align: center; }
.cambios li b { font-weight: 600; }
.cambios li .d { color: var(--tenue); display: block; font-size: 12px; margin-top: 2px; }
.vacio-c { margin: 0; font-size: 13px; color: var(--tenue); }

/* Bloques y tarjetas */
.bloque { display: flex; flex-direction: column; gap: 12px; }
.bloque-cab { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px 16px; border-bottom: 1px solid var(--borde); padding-bottom: 10px; }
.bloque-cab h2 { font-size: 14px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; }
.bloque-cab .pregunta { font-size: 13px; color: var(--tenue); font-weight: 400; letter-spacing: 0; text-transform: none; margin-left: 10px; }
.bloque-cuenta { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--tenue); }
.bloque-cuenta > span { display: inline-flex; align-items: center; gap: 6px; }
.bloque-cuenta .foco { width: 8px; height: 8px; }
.grilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); grid-auto-flow: dense; gap: 12px; }
.luz { background: var(--tarjeta); border: 1px solid var(--borde); border-top: 3px solid var(--s); display: flex; flex-direction: column; min-width: 0; }
.luz.s-rojo { border-color: rgba(255, 92, 92, .45); border-top-color: var(--rojo); }
.luz.ancha { grid-column: span 2; }
.luz.abierta { box-shadow: 0 0 0 1px var(--acento); }
.luz-btn { cursor: pointer; display: flex; flex-direction: column; gap: 8px; padding: 16px 18px; flex: 1; }
.luz-btn:focus-visible { outline: 2px solid var(--acento); outline-offset: -2px; }
.luz-btn:hover h3 { color: var(--acento); }
.luz-cab { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.luz-cab h3 { font-size: 15px; font-weight: 600; min-width: 0; text-wrap: balance; }
.luz-estado { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--s); white-space: nowrap; }
.val-fila { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; }
.luz-val { font-family: var(--mono); font-size: 32px; font-weight: 500; letter-spacing: -.02em; color: var(--s); line-height: 1.05; }
.luz.s-gris .luz-val { color: var(--tenue); }
.luz-ref { margin: 0; font-size: 13px; color: var(--tenue); line-height: 1.4; }
.tend { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; flex: none; }
.tend svg { display: block; }
.tend-txt { font-size: 11px; color: var(--tenue); white-space: nowrap; }
.tend-txt.mejora { color: var(--verde); } .tend-txt.empeora { color: var(--rojo); }
.partes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
.parte { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.parte + .parte { border-left: 1px solid var(--borde); padding-left: 20px; }
.parte-cab { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--tenue); }
.parte-cab .foco { width: 8px; height: 8px; }
.parte-val { font-family: var(--mono); font-size: 28px; font-weight: 500; letter-spacing: -.02em; line-height: 1.1; color: var(--s); }
.parte .luz-ref { font-size: 12px; }
.tramos-mini { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--tenue); }
.tramos-mini b { font-family: var(--mono); font-weight: 500; color: var(--tinta); }
.leyenda-luz { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.leyenda-luz li { display: flex; align-items: flex-start; gap: 6px; font-size: 12px; line-height: 1.35; color: var(--tenue); opacity: .65; min-width: 0; }
.leyenda-luz li .foco { width: 8px; height: 8px; margin-top: 4px; }
.leyenda-luz li.actual { opacity: 1; color: var(--s); font-weight: 600; }
.resp { display: flex; flex-direction: column; gap: 6px; border-top: 1px solid var(--borde); padding-top: 10px; }
.resp-quien { font-size: 12px; color: var(--tenue); }
.resp-quien b { color: var(--tinta); font-weight: 500; }
.coment { margin: 0; font-size: 13px; line-height: 1.4; color: var(--tinta); background: var(--suave); border-left: 2px solid var(--s); padding: 6px 10px; }
.abrir { font-size: 12px; color: var(--tenue); font-family: var(--mono); align-self: flex-end; margin-top: auto; }
.luz.abierta .abrir, .luz-btn:hover .abrir { color: var(--acento); }

/* Composición del balance: tortas de activo y pasivo */
.compo { background: var(--tarjeta); border: 1px solid var(--borde); padding: 16px 18px; display: flex; flex-direction: column; gap: 14px; }
.compo-cab { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 6px 16px; }
.compo-cab h3 { font-size: 15px; font-weight: 600; }
.compo-cab .nota { font-size: 12px; color: var(--tenue); font-family: var(--mono); }
.compo-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
.torta { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 18px; align-items: center; min-width: 0; }
.torta svg { display: block; width: 170px; height: 170px; }
.torta path { cursor: default; transition: opacity .15s; }
.torta:has(path:hover) path:not(:hover) { opacity: .45; }

.tabla { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }

.tabla .t-cab { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--tenue); border-bottom: 1px solid var(--borde); padding-bottom: 6px; }

.tramos-v { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.tv { display: flex; flex-direction: column; gap: 2px; background: var(--tarjeta); border-top: 3px solid; padding: 10px 12px; min-width: 0; }

@media (max-width: 900px) { .titular { grid-template-columns: 1fr 1fr; } .titular .estado { grid-column: 1 / -1; } }
@media (max-width: 640px) {
  .titular { grid-template-columns: 1fr; }
  .big { font-size: 34px; }
  .luz.ancha { grid-column: auto; }
  .partes { grid-template-columns: 1fr; } .parte + .parte { border-left: 0; padding-left: 0; border-top: 1px solid var(--borde); padding-top: 12px; }
  .fila-v { grid-template-columns: 1fr; gap: 4px; } .fila-v .num { text-align: left; }

}

/* Explicaciones (ⓘ): al pasar el mouse, al hacer foco o al tocar en el celular */

<body>
  <main class="pagina" id="app">
    <div class="vacio">Cargando datos…</div>
  </main>

  <script src="config.js"></script>
  <script>
/* Lectura de las planillas y cálculos. Sin dependencias (corre también en Node para pruebas). */
(function (root) {
  'use strict';

  var MESES = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio',
    'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
  var MESES_CORTO = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];

  var RUBROS = [
    { key: 'caja', label: 'Caja y bancos', alias: ['caja y bancos', 'caja'], lado: 'activo', acido: true },
    { key: 'cheques', label: 'Ch. en cartera', alias: ['ch en cartera', 'cheques en cartera'], lado: 'activo', acido: true },
    { key: 'cobrar', label: 'Cuentas a cobrar', alias: ['cuentas a cobrar', 'deuda en la calle'], lado: 'activo', acido: true },
    { key: 'stock', label: 'Stock (a valor compra)', alias: ['stock valor compra', 'stock a valor compra', 'stock al costo', 'stock costo', 'stock valor venta', 'stock a valor venta', 'stock'], lado: 'activo', acido: false },
    { key: 'vehiculos', label: 'Vehículos', alias: ['vehiculos mm', 'vehiculos'], lado: 'activo', acido: false },
    { key: 'inmueble', label: 'Inmueble Juncal 1871', alias: ['inmueble juncal 1871', 'inmueble'], lado: 'activo', acido: false },
    { key: 'chpropio', label: 'Ch. propio pendiente', alias: ['ch propio pendiente', 'ch propio pen', 'cheque propio pendiente', 'ch propio'], lado: 'pasivo', acido: true },
    { key: 'proveedores', label: 'Proveedores', alias: ['proveedores', 'deuda con proveedores'], lado: 'pasivo', acido: true },
    { key: 'fiscales', label: 'Deudas fiscales', alias: ['deudas fiscales'], lado: 'pasivo', acido: false },
    { key: 'prestamos', label: 'Préstamos bancarios', alias: ['prestamos bancarios'], lado: 'pasivo', acido: false },
    { key: 'dividendos', label: 'Dividendos y fondo líquido pendiente', alias: ['dividendos y fondo liquido pendiente', 'dividendos'], lado: 'pasivo', acido: false },
    { key: 'empleados', label: 'Deudas con los empleados', alias: ['deudas con los empleados', 'deudas con empleados'], lado: 'pasivo', acido: false },
    { key: 'hipotecarias', label: 'Deudas hipotecarias', alias: ['deudas hipotecarias'], lado: 'pasivo', acido: false },
    { key: 'socios', label: 'Deudas con los socios', alias: ['deudas con los socios', 'deudas con socios'], lado: 'pasivo', acido: false }
  ];

  function norm(s) {
    return String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '')
      .toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
  }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function sum(a) { return a.reduce(function (x, y) { return x + y; }, 0); }

  // CSV (RFC 4180): comillas, comas dentro de comillas, saltos CRLF.
  function parseCSV(text) {
    var rows = [], row = [], field = '', inQ = false, i = 0, c;
    text = String(text || '').replace(/^﻿/, '');
    while (i < text.length) {
      c = text[i];
      if (inQ) {
        if (c === '"') {
          if (text[i + 1] === '"') { field += '"'; i += 2; continue; }
          inQ = false; i++; continue;
        }
        field += c; i++; continue;
      }
      if (c === '"') { inQ = true; i++; continue; }
      if (c === ',') { row.push(field); field = ''; i++; continue; }
      if (c === '\r') { i++; continue; }
      if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; i++; continue; }
      field += c; i++;
    }
    if (field !== '' || row.length) { row.push(field); rows.push(row); }
    return rows.filter(function (r) { return r.some(function (v) { return String(v).trim() !== ''; }); });
  }

  // Importes de VentasTrack: mismo criterio que usa VentasTrack, para que los totales coincidan.
  function parseAmt(raw) {
    if (typeof raw === 'number') return raw;
    var s = String(raw == null ? '' : raw).trim().replace(/[$\s\r]/g, '').replace(/[−–]/g, '-');
    if (!s || s === '-') return null;
    var neg = false;
    if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
    if (s.slice(-1) === '-') { neg = true; s = s.slice(0, -1); }
    if (s[0] === '-') { neg = !neg; s = s.slice(1); }
    if (!s) return null;
    if (s.indexOf(',') !== -1 && s.indexOf('.') === -1) s = s.replace(',', '.');
    else if (s.indexOf(',') !== -1 && s.indexOf('.') !== -1) s = s.replace(/\./g, '').replace(',', '.');
    else s = s.replace(/\./g, '');
    var v = parseFloat(s);
    if (!isFinite(v)) return null;
    return neg ? -v : v;
  }

  // Importes de la planilla del tablero ("12.600.000", "1.234,56", con $ o negativos).
  function parseNum(v) {
    if (v == null) return null;
    if (typeof v === 'number') return isFinite(v) ? v : null;
    var s = String(v).trim();
    if (!s || s === '-' || s === '—') return null;
    var neg = false;
    if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
    s = s.replace(/[$\s ]/g, '');
    if (s[0] === '-' || s[0] === '−') { neg = true; s = s.slice(1); }
    var lastDot = s.lastIndexOf('.'), lastComma = s.lastIndexOf(',');
    if (lastDot > -1 && lastComma > -1) {
      s = lastComma > lastDot ? s.replace(/\./g, '').replace(',', '.') : s.replace(/,/g, '');
    } else if (lastComma > -1) {
      s = /^\d{1,3}(,\d{3})+$/.test(s) ? s.replace(/,/g, '') : s.replace(',', '.');
    } else if (lastDot > -1) {
      if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
    }
    if (!/^\d*\.?\d+$/.test(s)) return null;
    var n = Number(s);
    return isFinite(n) ? (neg ? -n : n) : null;
  }

  function mkDate(y, m, d) {
    if (y < 100) y += 2000;
    if (m < 1 || m > 12 || d < 1 || d > 31) return null;
    return { y: y, m: m, d: d, key: y + '-' + pad(m) + '-' + pad(d), mes: y + '-' + pad(m) };
  }
  // Fechas dd/mm/aaaa o aaaa-mm-dd (ignora la hora).
  function parseDate(v) {
    var s = String(v == null ? '' : v).trim().split(/[ T]/)[0];
    var m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
    if (m) return mkDate(+m[3], +m[2], +m[1]);
    m = s.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})$/);
    if (m) return mkDate(+m[1], +m[2], +m[3]);
    return null;
  }

  // "Octubre", "oct", "10", "setiembre" → 0..11
  function mesIndice(v) {
    var n = norm(v);
    if (!n) return -1;
    if (/^\d{1,2}$/.test(n)) { var k = +n; return k >= 1 && k <= 12 ? k - 1 : -1; }
    if (n === 'setiembre' || n === 'set') return 8;
    for (var i = 0; i < 12; i++) {
      if (n === norm(MESES[i]) || n === norm(MESES_CORTO[i])) return i;
    }
    return -1;
  }

  // Mes "aaaa-mm" a partir de "2026-10", "10/2026", "octubre 2026" o una fecha.
  function parseMes(v) {
    var s = String(v == null ? '' : v).trim(), m;
    if ((m = s.match(/^(\d{4})[\/\-.](\d{1,2})$/))) return m[1] + '-' + pad(+m[2]);
    if ((m = s.match(/^(\d{1,2})[\/\-.](\d{4})$/))) return m[2] + '-' + pad(+m[1]);
    var d = parseDate(s);
    if (d) return d.mes;
    var n = norm(s), y = n.match(/\d{4}/);
    if (y) {
      var palabras = n.replace(/\d{4}/, '').trim();
      var i = mesIndice(palabras);
      if (i > -1) return y[0] + '-' + pad(i + 1);
    }
    return null;
  }

  function findCol(headers, aliases) {
    var h = headers.map(norm), i, j;
    for (i = 0; i < aliases.length; i++) { j = h.indexOf(aliases[i]); if (j > -1) return j; }
    for (i = 0; i < aliases.length; i++) {
      for (j = 0; j < h.length; j++) if (h[j].indexOf(aliases[i]) === 0) return j;
    }
    return -1;
  }
  function esColAnio(h) { var n = norm(h); return n === 'ano' || n === 'anio' || n === 'year'; }
  function falta(pest, col) { throw new Error('En la pestaña ' + pest + ' no se encontró la columna "' + col + '".'); }

  /* ---------- VentasTrack ---------- */

  // Ventas: Fecha | Vendedor | Cliente | Importe (una fila por venta)
  function leerVentas(rows) {
    if (!rows || !rows.length) return [];
    var h = rows[0];
    var cF = findCol(h, ['fecha', 'date']), cV = findCol(h, ['vendedor', 'seller']);
    var cC = findCol(h, ['cliente', 'client']), cI = findCol(h, ['importe', 'amount', 'monto', 'total']);
    if (cF < 0) falta('Ventas (VentasTrack)', 'Fecha');
    if (cV < 0) falta('Ventas (VentasTrack)', 'Vendedor');
    if (cI < 0) falta('Ventas (VentasTrack)', 'Importe');
    var out = [];
    rows.slice(1).forEach(function (r) {
      var f = parseDate(r[cF]), vend = String(r[cV] || '').trim(), imp = parseAmt(r[cI]);
      // Mismo filtro que VentasTrack: con vendedor, importe distinto de cero y fecha válida.
      if (!f || !vend || !imp) return;
      out.push({ fecha: f, vendedor: vend, cliente: cC > -1 ? String(r[cC] || '').trim() : '', importe: imp });
    });
    return out;
  }

  // Objetivos: Vendedor | Año | Enero | Febrero | ...  →  objetivo por vendedor y por mes ("2026-10")
  function leerObjetivos(rows, anioPorDefecto) {
    var out = { vendedores: [], porVendedor: {} };
    if (!rows || !rows.length) return out;
    var h = rows[0], cV = findCol(h, ['vendedor', 'seller']), cA = -1, cols = [];
    if (cV < 0) falta('Objetivos (VentasTrack)', 'Vendedor');
    h.forEach(function (x, i) {
      if (i === cV) return;
      if (esColAnio(x)) { cA = i; return; }
      var mi = mesIndice(x);
      if (mi > -1) cols.push({ i: i, m: mi });
    });
    rows.slice(1).forEach(function (r) {
      var vend = String(r[cV] || '').trim();
      if (!vend) return;
      var y = cA > -1 ? parseInt(String(r[cA] || '').replace(/[^\d]/g, ''), 10) : NaN;
      if (!y) y = anioPorDefecto;
      if (out.vendedores.indexOf(vend) < 0) out.vendedores.push(vend);
      if (!out.porVendedor[vend]) out.porVendedor[vend] = {};
      cols.forEach(function (c) {
        var v = parseAmt(r[c.i]);
        if (v > 0) out.porVendedor[vend][y + '-' + pad(c.m + 1)] = v;
      });
    });
    return out;
  }

  /* Facturación: Mes | Año | Facturado | Facturable.
     La facturación del mes es Facturado + Facturable (el facturable solo tiene valor en el mes vigente). */
  function leerFacturacion(rows, anioPorDefecto) {
    var out = { total: {}, facturado: {}, facturable: {} };
    if (!rows || !rows.length) return out;
    var h = rows[0], cM = -1, cA = -1, cF = -1, cL = -1;
    h.forEach(function (x, i) {
      var n = norm(x);
      if (esColAnio(x)) cA = i;
      else if (cM < 0 && /^(mes|month)/.test(n)) cM = i;
      else if (cL < 0 && /(facturable|billable)/.test(n)) cL = i;
      else if (cF < 0 && /(facturado|billed)/.test(n)) cF = i;
    });
    if (cM < 0) falta('Facturación (VentasTrack)', 'Mes');
    if (cF < 0) falta('Facturación (VentasTrack)', 'Facturado');
    rows.slice(1).forEach(function (r) {
      var mi = mesIndice(r[cM]);
      if (mi < 0) return;
      var y = cA > -1 ? parseInt(String(r[cA] || '').replace(/[^\d]/g, ''), 10) : NaN;
      if (!y) y = anioPorDefecto;
      var fa = parseAmt(r[cF]), fl = cL > -1 ? parseAmt(r[cL]) : null;
      if (fa == null && fl == null) return; // celdas vacías: mes sin dato
      var k = y + '-' + pad(mi + 1);
      out.facturado[k] = fa || 0;
      out.facturable[k] = fl || 0;
      out.total[k] = (fa || 0) + (fl || 0);
    });
    return out;
  }

  // Feriados: una fecha por fila
  function leerFeriados(rows) {
    var out = {};
    if (!rows || !rows.length) return out;
    var c = findCol(rows[0], ['fecha', 'date']);
    rows.forEach(function (r, i) {
      var f = parseDate(c > -1 ? r[c] : r[0]);
      if (f) out[f.key] = true;
      else if (i === 0) return; // encabezado
    });
    return out;
  }

  /* ---------- Planilla del tablero ---------- */

  function leerEquilibrio(rows) {
    var out = {};
    if (!rows || !rows.length) return out;
    var cM = findCol(rows[0], ['mes']), cP = findCol(rows[0], ['punto de equilibrio', 'equilibrio', 'pe']);
    if (cM < 0 || cP < 0) return out;
    rows.slice(1).forEach(function (r) {
      var mes = parseMes(r[cM]), v = parseNum(r[cP]);
      if (mes && v) out[mes] = v;
    });
    return out;
  }

  function leerBalance(rows) {
    if (!rows || !rows.length) return [];
    var cf = findCol(rows[0], ['fecha']);
    if (cf < 0) falta('BALANCE', 'Fecha');
    var cols = {}, faltan = [];
    RUBROS.forEach(function (r) {
      cols[r.key] = findCol(rows[0], r.alias);
      if (cols[r.key] < 0) faltan.push(r.label);
    });
    if (faltan.length) throw new Error('En la pestaña BALANCE no se encontró la columna: ' + faltan.join(', ') + '.');
    var out = [];
    rows.slice(1).forEach(function (r) {
      var f = parseDate(r[cf]);
      if (!f) return;
      var vals = {}, alguno = false;
      RUBROS.forEach(function (ru) {
        var n = parseNum(r[cols[ru.key]]);
        if (n != null) alguno = true;
        vals[ru.key] = n || 0;
      });
      if (alguno) out.push({ fecha: f, vals: vals });
    });
    return out.sort(function (a, b) { return a.fecha.key < b.fecha.key ? -1 : a.fecha.key > b.fecha.key ? 1 : 0; });
  }

  function etiquetaTramo(h) {
    var t = String(h || '').trim();
    if (/\d\s*$/.test(t) && !/d[ií]as\s*$/i.test(t)) t += ' días';
    return t.charAt(0).toUpperCase() + t.slice(1);

    return valor < u[0] ? 'rojo' : valor < u[1] ? 'amarillo' : 'verde';
  }
  function regla(u, sentido, unidad) {
    if (!u) return null;
    function n(v) { return (v < 0 ? '−' : '') + (unidad === 'x' ? nfx : nf0).format(Math.abs(v)); }
    function f(v) { return n(v) + (unidad === 'x' ? 'x' : unidad === 'dias' ? ' días' : '%'); }
    var a = u[0], b = u[1], out = [];
    if (sentido === 'menor') {
      out.push({ estado: 'verde', texto: 'Hasta ' + f(a) });
      if (b > a) out.push({ estado: 'amarillo', texto: n(a) + ' a ' + f(b) });
      out.push({ estado: 'rojo', texto: 'Más de ' + f(b) });
    } else {
      out.push({ estado: 'verde', texto: f(b) + ' o más' });
      if (b > a) out.push({ estado: 'amarillo', texto: n(a) + ' a ' + f(b) });
      out.push({ estado: 'rojo', texto: 'Menos de ' + f(a) });
    }
    return out;
  }
  var NOMBRE = { rojo: 'Crítico', amarillo: 'Alerta', verde: 'En orden', gris: 'Sin dato' };
  var PESO = { rojo: 0, amarillo: 1, verde: 2, gris: 3 };

  // ---------- Ventas por cliente (VentasTrack) ----------
  var cacheVentas = { rows: null, data: null };
  function ventasPlanas() {
    var rows = estado.tablas && estado.tablas.ventas;
    if (cacheVentas.rows === rows) return cacheVentas.data;
    var out = { ok: false, sinCliente: false, filas: [] };
    if (rows && rows.length > 1) {
      var h = rows[0].map(norm);
      var col = function (list) { for (var i = 0; i < h.length; i++) if (list.indexOf(h[i]) > -1) return i; return -1; };
      var cF = col(['fecha', 'date']), cV = col(['vendedor', 'seller']), cC = col(['cliente', 'client', 'razon social']), cI = col(['importe', 'amount', 'monto', 'total']);
      if (cF > -1 && cV > -1 && cI > -1) {
        out.ok = true; out.sinCliente = cC < 0;
        rows.slice(1).forEach(function (r) {
          var f = C.parseDate(r[cF]), imp = C.parseAmt(r[cI]), vend = String(r[cV] || '').trim();
          if (!f || !vend || !imp) return;
          var nom = cC > -1 ? String(r[cC] || '').trim() : '';
          out.filas.push({ f: f, vend: vend, imp: imp, cli: norm(nom), nom: nom });
        });
      }
    }
    cacheVentas = { rows: rows, data: out };
    return out;
  }

  /* Clientes del mes. Un cliente es activo si su compra neta del mes es mayor a cero.
     Se compara contra el mismo mes del año anterior; en el mes en curso, hasta el mismo día. */
  function clientes(d) {
    var V = ventasPlanas();
    if (!V.ok) return null;
    if (V.sinCliente) return { error: 'La pestaña Ventas de VentasTrack no tiene columna Cliente' };
    var p = d.mes.split('-'), y = +p[0], m = +p[1];
    var yA = y - 1, mA = m;
    var mesAnt = yA + '-' + (mA < 10 ? '0' : '') + mA;
    var tope = d.esActual ? new Date().getDate() : 31;
    var act = {}, ant = {}, antTot = {}, nombres = {}, hayAnt = false;
    V.filas.forEach(function (r) {
      if (!r.cli) return;
      nombres[r.cli] = r.nom;
      if (r.f.mes === d.mes) act[r.cli] = (act[r.cli] || 0) + r.imp;
      else if (r.f.mes === mesAnt) {
        hayAnt = true;
        antTot[r.cli] = (antTot[r.cli] || 0) + r.imp;
        if (r.f.d <= tope) ant[r.cli] = (ant[r.cli] || 0) + r.imp;
      }
    });
    function activos(o) { return Object.keys(o).filter(function (k) { return o[k] > 0; }); }
    var la = activos(act), lp = activos(ant);
    var orden = la.map(function (k) { return { nom: nombres[k], imp: act[k] }; }).sort(function (a, b) { return b.imp - a.imp; });
    var total = sum(orden.map(function (x) { return x.imp; }));
    var top = Math.max(1, Math.ceil(la.length * 0.2));
    var topSum = sum(orden.slice(0, top).map(function (x) { return x.imp; }));
    var setA = {}; la.forEach(function (k) { setA[k] = 1; });
    var setP = {}; lp.forEach(function (k) { setP[k] = 1; });
    var dejaron = activos(antTot).filter(function (k) { return !setA[k]; })
      .map(function (k) { return { nom: nombres[k], imp: antTot[k] }; }).sort(function (a, b) { return b.imp - a.imp; });
    return {
      activos: la.length, activosAnt: lp.length, mesAnt: C.MESES[mA - 1].toLowerCase() + ' ' + yA, mesAntCorto: C.MESES[mA - 1].slice(0, 3).toLowerCase() + '. ' + String(yA).slice(2),
      varAct: hayAnt && lp.length ? (la.length / lp.length - 1) * 100 : null,
      siguen: la.filter(function (k) { return setP[k]; }).length,
      nuevos: la.filter(function (k) { return !setP[k]; }).length,
      dejaron: dejaron, total: total, orden: orden,
      top: top, conc: total ? topSum / total * 100 : null, mayor: total ? orden[0].imp / total * 100 : null
    };
  }

  // ---------- Cortes semanales de la planilla del tablero ----------
  function colPor(h, alias) {
    var i, j;
    for (i = 0; i < alias.length; i++) { j = h.indexOf(alias[i]); if (j > -1) return j; }
    for (i = 0; i < alias.length; i++) for (j = 0; j < h.length; j++) if (h[j].indexOf(alias[i]) === 0) return j;
    return -1;
  }
  function porFecha(a, b) { return a.fecha.key < b.fecha.key ? -1 : a.fecha.key > b.fecha.key ? 1 : 0; }

  function cortesBalance(rows) {
    if (!rows || rows.length < 2) return [];
    var h = rows[0].map(norm), cf = colPor(h, ['fecha']);
    if (cf < 0) return [];
    var cols = {};
    C.RUBROS.forEach(function (r) { cols[r.key] = colPor(h, r.alias); });
    var out = [];
    rows.slice(1).forEach(function (r) {
      var f = C.parseDate(r[cf]);
      if (!f) return;
      var vals = {}, alguno = false;
      C.RUBROS.forEach(function (ru) { var n = cols[ru.key] > -1 ? C.parseNum(r[cols[ru.key]]) : null; if (n != null) alguno = true; vals[ru.key] = n || 0; });
      if (!alguno) return;
      var aA = 0, aP = 0;
      C.RUBROS.forEach(function (ru) { if (ru.acido) { if (ru.lado === 'activo') aA += vals[ru.key]; else aP += vals[ru.key]; } });
      out.push({ fecha: f, vals: vals, acA: aA, acP: aP, acido: aP ? aA / aP : null });
    });
    return out.sort(porFecha);
  }

  // Vencido = tramos de 30 días en adelante ("+30", "+40", "+50", "30 a 45", "más de 60"...).
  function vencido(label) {
    var n = norm(label);
    if (/menos|hasta|vencer|no venc|corriente/.test(n) || /^\s*</.test(label)) return false;
    var num = n.match(/\d+/);
    if (!num || /^0 /.test(n) || +num[0] < 30) return false;
    return true;
  }
  function cortesVenc(rows) {
    if (!rows || rows.length < 2) return [];
    var h = rows[0].map(norm), cf = colPor(h, ['fecha']);
    if (cf < 0) return [];
    var tramos = [];
    rows[0].forEach(function (x, i) {
      var n = norm(x);
      if (i === cf || !n || n.indexOf('total') === 0 || n.indexOf('observ') === 0) return;
      var t = String(x).trim();
      if (/\d\s*$/.test(t) && !/d[ií]as\s*$/i.test(t)) t += ' días';
      tramos.push({ col: i, label: t.charAt(0).toUpperCase() + t.slice(1), venc: vencido(x) });
    });
    var out = [];
    rows.slice(1).forEach(function (r) {
      var f = C.parseDate(r[cf]);
      if (!f) return;
      var alguno = false;
      var ts = tramos.map(function (t) { var x = C.parseNum(r[t.col]); if (x != null) alguno = true; return { label: t.label, venc: t.venc, valor: x || 0 }; });
      if (!alguno) return;
      var total = sum(ts.map(function (t) { return t.valor; }));
      var v = sum(ts.filter(function (t) { return t.venc; }).map(function (t) { return t.valor; }));
      out.push({ fecha: f, tramos: ts, total: total, vencido: v, pct: total ? v / total * 100 : null });
    });
    return out.sort(porFecha);
  }

  // ---------- Historia de meses (para tendencias) ----------
  function historia(d, opc) {
    var ms = d.meses.filter(function (m) { return m <= d.mes; }).sort().slice(-6);
    return ms.map(function (m) {
      var dm = m === d.mes ? d : C.calcular(estado.tablas, m, opc);

  }

  // ---------- Valores de cada indicador para un mes ----------
  function vPE(dm) {
    var f = dm.facturacion, base = dm.esActual ? f.proyeccion : f.total;

  }
  function vRitmo(dm) {

  }
  function vBO(dm) { return dm.empresa.total > 0 && dm.facturacion.hayDato ? dm.facturacion.boPct : null; }

  // Con menos de estos días hábiles transcurridos, las proyecciones del mes en curso no se evalúan.

  /* Cobertura de stock: stock al costo ÷ margen ÷ IVA = stock a valor venta neta,

  var STOCK_COSTO = isFinite(+CFG.stockCosto) && +CFG.stockCosto > 0 ? +CFG.stockCosto : 0.74;
  var STOCK_IVA = isFinite(+CFG.stockIva) && +CFG.stockIva > 0 ? +CFG.stockIva : 1.21;
  function cobStock(c, d) {
    var costo = c.vals.stock || 0, venta = costo / STOCK_COSTO / STOCK_IVA, meses = [];
    for (var k = 1; k <= 3; k++) {
      var y = c.fecha.y, m = c.fecha.m - k;

    }

    var prom = con.length ? con.reduce(function (t, x) { return t + x.v; }, 0) / con.length : null;
    var rot = meses[0].nom.slice(0, 3).toLowerCase() + '–' + meses[2].nom.slice(0, 3).toLowerCase() + (con.length < 3 ? ', ' + con.length + ' con dato' : '');
    return { costo: costo, venta: venta, dias: prom ? Math.round(venta / (prom / 30)) : null, prom: prom, detalle: meses, rotulo: rot };
  }

  function indicadores(d, H, CB, CV) {

    out.push({

    out.push({

      ref: f.hayDato ? f.p + '% del objetivo con ' + d.mthPct + '% del mes · ' + M(f.total) + ' facturado + facturable' : 'Sin facturación cargada para el mes',
      sentido: 'mayor', unidad: '%', serie: serie(function (h) { return h.d.empresa.objetivo && h.d.facturacion.hayDato ? h.d.facturacion.diff : null; }), det: detFact
    });
    var pe = temprano ? null : vPE(d), base = d.esActual ? f.proyeccion : f.total;
    out.push({

    // Crecimiento real: mes elegido y acumulado a último mes cerrado, 2025 ajustado por inflación

      .map(function (x) { return { et: x.corto, v: x.varReal * 100 }; });

    out.push({

    });

    });

      sentido: 'menor', unidad: '%', serie: CV.slice(-6).map(function (c) { return { et: F(c.fecha), v: c.pct }; }), serieTxt: 'últimos cortes', det: detDeuda, CV: CV
    });

    });

    });

    // Explicación de cada indicador: qué mide, cómo se calcula (con los números de hoy) y de dónde sale.
    var hab = d.transcurridos + ' de ' + d.totalDias + ' días hábiles';

      '<div class="t-r t-tot"><span>Total</span><span>' + M(b.acP) + '</span></div></div></div>' +
      nota('Liquidez ácida = activo líquido ÷ pasivo inmediato. Corte ' + F(b.fecha) + '.');
  }

  // ---------- Explicaciones (ⓘ) ----------
  /* Se ven al pasar el mouse o al hacer foco en la "i"; en el celular, al tocarla. */
  function info(titulo, partes) {
    return '<span class="info"><button class="info-btn" type="button" aria-label="Cómo se calcula: ' + esc(titulo) + '">i</button>' +
      '<span class="info-pop" role="tooltip">' + partes.filter(function (x) { return x && x[1]; }).map(function (x) {
        return '<span class="ip-r"><b>' + esc(x[0]) + '</b>' + esc(x[1]) + '</span>';
      }).join('') + '</span></span>';
  }
  function infoTarjeta(it) {
    var I = it.info || {};
    var colores = it.regla ? it.regla.map(function (r) { return { verde: 'Verde', amarillo: 'Amarillo', rojo: 'Rojo' }[r.estado] + ': ' + r.texto.charAt(0).toLowerCase() + r.texto.slice(1); }).join(' · ') + '. Los límites se cambian en la pestaña UMBRALES.' : '';
    var pts = (it.serie || []).filter(function (p) { return p.v != null && isFinite(p.v); }).length;
    var tend = pts >= 2 ? 'La línea chica muestra la ' + (it.serieTxt ? it.serieTxt : 'evolución en los últimos ' + pts + ' meses') + ' y si viene mejorando o empeorando contra el dato anterior.' : '';
    return info(it.titulo, [['Qué mide', I.mide], ['Cómo se calcula', I.calc], ['De dónde sale', I.fuente], ['Colores', colores], ['Tendencia', tend]]);
  }

  // ---------- Tarjeta ----------
  function tarjeta(it, d, H) {
    var abierta = !!estado.abiertas[it.key];
    var cuerpo;
    if (it.partes) {
      cuerpo = '<div class="partes">' + it.partes.map(function (x) {
        return '<div class="parte s-' + x.estado + '"><div class="parte-cab"><span class="foco"></span>' + esc(x.rotulo) + '</div>' +
          '<div class="parte-val">' + (x.valor != null ? esc(x.valor) : '—') + '</div><p class="luz-ref">' + esc(x.ref) + '</p></div>';
      }).join('') + '</div><div class="val-fila"><p class="luz-ref">' + esc(it.ref) + '</p>' + tendencia(it) + '</div>';
    } else {
      cuerpo = '<div class="val-fila"><span class="luz-val">' + (it.valor != null ? esc(it.valor) : '—') + '</span>' + tendencia(it) + '</div>' +
        '<p class="luz-ref">' + esc(it.ref) + '</p>' +
        (it.tramos && it.tramos.length ? '<div class="tramos-mini">' + it.tramos.map(function (t) {
          return '<span>' + esc(t.label) + ' <b>' + (it.corte.total ? nf0.format(t.valor / it.corte.total * 100) : '—') + '%</b></span>';
        }).join('') + '</div>' : '');
    }
    var usados = it.partes ? it.partes.map(function (x) { return x.estado; }) : [it.estado];
    var ley = it.regla && it.estado !== 'gris' ? '<ul class="leyenda-luz" aria-label="Rangos de cada color">' + it.regla.map(function (r) {
      return '<li class="s-' + r.estado + (usados.indexOf(r.estado) > -1 ? ' actual' : '') + '"><span class="foco"></span><span>' + esc(r.texto) + '</span></li>';
    }).join('') + '</ul>' : '';
    var ex = it.extra;
    var resp = ex.resp || ex.com ? '<div class="resp">' + (ex.resp ? '<span class="resp-quien">Responsable: <b>' + esc(ex.resp) + '</b></span>' : '') +
      (ex.com ? '<p class="coment">' + esc(ex.com) + '</p>' : '') + '</div>' : '';
    return '<article class="luz' + (it.ancha ? ' ancha' : '') + (abierta ? ' abierta' : '') + ' s-' + it.estado + '" data-key="' + it.key + '">' +
      '<div class="luz-btn" role="button" tabindex="0" aria-expanded="' + abierta + '">' +
      '<div class="luz-cab"><h3>' + esc(it.titulo) + '</h3><span class="cab-der"><span class="luz-estado"><span class="foco"></span>' + NOMBRE[it.estado] + '</span>' + infoTarjeta(it) + '</span></div>' +
      cuerpo + ley + resp +
      '<span class="abrir">' + (abierta ? 'Cerrar detalle ▴' : 'Ver detalle ▾') + '</span></div></article>';
  }

  // ---------- Bloques ----------
  var GRUPOS = [
    { g: 'Comercial', p: '¿Llegamos al mes?' },
    { g: 'Clientes', p: '¿Cómo está la cartera?' },
    { g: 'Financiero', p: '¿Nos están pagando?' }
  ];
  function focoVista(lista, d, H) {
    var it = lista.filter(function (x) { return estado.abiertas[x.key]; })[0];
    if (!it) return '';
    var det;
    try { det = it.det(it, d, H); } catch (err) { det = nota('No se pudo armar el detalle: ' + err.message); }
    return '<section class="bloque foco-vista" id="foco-vista" aria-label="Detalle: ' + esc(it.titulo) + '"><div class="bloque-cab"><h2>' + esc(it.grupo) +
      '<span class="pregunta">Detalle de ' + esc(it.titulo) + '</span></h2></div>' +
      '<div class="foco-cuerpo">' + tarjeta(it, d, H) + '<div class="detalle s-' + it.estado + '">' + det + '</div></div></section>';
  }
  /* Tortas de composición del activo y del pasivo, último corte de BALANCE.
     Cada rubro tiene siempre el mismo color (por rubro, no por tamaño). */
  var PALETA = ['#3987e5', '#d95926', '#199e70', '#c98500', '#d55181', '#008300', '#9085e9', '#e66767'];
  function torta(titulo, lado, b) {
    var rub = C.RUBROS.filter(function (r) { return r.lado === lado; });
    var items = rub.map(function (r, i) { return { n: r.label, v: Math.max(0, b.vals[r.key] || 0), c: PALETA[i % PALETA.length] }; });
    var tot = items.reduce(function (t, x) { return t + x.v; }, 0);
    if (!tot) return '<div class="torta"><p class="det-nota">Sin datos de ' + titulo.toLowerCase() + ' en el corte.</p></div>';
    var R = 80, r0 = 50, cx = 85, cy = 85, a = -Math.PI / 2, svg = '';
    function pt(rr, ang) { return (cx + rr * Math.cos(ang)).toFixed(2) + ' ' + (cy + rr * Math.sin(ang)).toFixed(2); }
    items.forEach(function (x) {
      if (!x.v) return;
      var da = x.v / tot * Math.PI * 2, a2 = a + da, lg = da > Math.PI ? 1 : 0, tip = esc(x.n) + ': ' + nf1.format(x.v / tot * 100) + '% · ' + M(x.v);
      if (da >= Math.PI * 2 - 1e-6) {
        svg += '<circle cx="' + cx + '" cy="' + cy + '" r="' + ((R + r0) / 2) + '" fill="none" stroke="' + x.c + '" stroke-width="' + (R - r0) + '"><title>' + tip + '</title></circle>';
      } else {
        svg += '<path d="M' + pt(R, a) + ' A' + R + ' ' + R + ' 0 ' + lg + ' 1 ' + pt(R, a2) + ' L' + pt(r0, a2) + ' A' + r0 + ' ' + r0 + ' 0 ' + lg + ' 0 ' + pt(r0, a) + 'Z" fill="' + x.c + '" stroke="#151B23" stroke-width="2"><title>' + tip + '</title></path>';
      }
      a = a2;
    });
    svg += '<text x="' + cx + '" y="' + (cy - 4) + '" text-anchor="middle" fill="#9AA7B5" font-size="11" letter-spacing="1.5">' + titulo.toUpperCase() + '</text>' +
      '<text x="' + cx + '" y="' + (cy + 15) + '" text-anchor="middle" fill="#E6EDF3" font-size="16" font-family="DM Mono, monospace">' + M(tot) + '</text>';
    var orden = items.filter(function (x) { return x.v; }).sort(function (p, q) { return q.v - p.v; });
    return '<div class="torta"><svg viewBox="0 0 170 170" role="img" aria-label="Composición del ' + titulo.toLowerCase() + '">' + svg + '</svg>' +
      '<ul class="torta-ley">' + orden.map(function (x) {
        return '<li><i style="background:' + x.c + '"></i><span class="n">' + esc(x.n) + '</span><span class="p">' + nf0.format(x.v / tot * 100) + '%</span><span class="m">' + M(x.v) + '</span></li>';
      }).join('') + '<li class="tot"><i></i><span class="n">Total ' + titulo.toLowerCase() + '</span><span class="p">100%</span><span class="m">' + M(tot) + '</span></li></ul></div>';
  }
  function composicion(b) {
    if (!b) return '';
    var act = 0, pas = 0;
    C.RUBROS.forEach(function (r) { var v = Math.max(0, b.vals[r.key] || 0); if (r.lado === 'activo') act += v; else pas += v; });
    return '<div class="compo"><div class="compo-cab"><h3>Composición del balance</h3><span class="nota">Corte ' + F(b.fecha) + ' · stock a valor compra</span></div>' +
      '<div class="compo-grid">' + torta('Activo', 'activo', b) + torta('Pasivo', 'pasivo', b) + '</div>' +
      '<p class="compo-pn">Activo ' + M(act) + ' − pasivo ' + M(pas) + ' = patrimonio neto <b>' + M(act - pas) + '</b></p></div>';
  }
  function bloques(lista, d, H) {
    return GRUPOS.map(function (G) {
      var items = lista.filter(function (it) { return it.grupo === G.g; });
      if (!items.length) return '';
      var cnt = { rojo: 0, amarillo: 0, verde: 0, gris: 0 };
      items.forEach(function (it) { cnt[it.estado]++; });
      var resto = items.filter(function (it) { return !estado.abiertas[it.key]; });
      var marcas = ['rojo', 'amarillo', 'verde', 'gris'].filter(function (s) { return cnt[s]; }).map(function (s) {
        return '<span class="s-' + s + '"><span class="foco"></span>' + cnt[s] + ' ' + NOMBRE[s].toLowerCase() + '</span>';
      }).join('');
      return '<section class="bloque" aria-label="' + G.g + '"><div class="bloque-cab"><h2>' + G.g + '<span class="pregunta">' + G.p + '</span></h2><div class="bloque-cuenta">' + marcas + '</div></div>' +
        (resto.length ? '<div class="grilla">' + resto.map(function (it) { return tarjeta(it, d, H); }).join('') + '</div>' : '') +
        (G.g === 'Financiero' ? composicion((lista.filter(function (x) { return x.key === 'acido'; })[0] || {}).corte) : '') +
'</section>';
    }).join('');
  }

  // ---------- Titular ----------
  function titular(lista, d, CV) {
    var cnt = { rojo: 0, amarillo: 0, verde: 0, gris: 0 };
    lista.forEach(function (it) { cnt[it.estado]++; });
    var general = cnt.rojo ? 'rojo' : cnt.amarillo ? 'amarillo' : cnt.verde ? 'verde' : 'gris';
    var tit = {
      rojo: cnt.rojo === 1 ? '1 indicador en rojo' : cnt.rojo + ' indicadores en rojo',
      amarillo: 'Sin rojos · ' + cnt.amarillo + (cnt.amarillo === 1 ? ' en alerta' : ' en alerta'),
      verde: 'Todo en orden', gris: 'Todavía no hay datos para evaluar'
    }[general];
    var foco = lista.filter(function (it) { return it.estado === 'rojo'; }).map(function (it) { return it.titulo.toLowerCase(); });
    var luz = { rojo: 'on-r', amarillo: 'on-a', verde: 'on-v' }[general] || '';
    var html = '<section class="titular" aria-label="Resumen"><div class="estado s-' + general + '">' +
      '<div class="semaforo ' + luz + '" aria-hidden="true"><i class="l-r"></i><i class="l-a"></i><i class="l-v"></i></div>' +
      '<div class="estado-txt"><span class="preg">Estado general · ' + esc(d.mesNombre) + ' ' + info('Estado general', [
        ['Qué muestra', 'Cuántos indicadores del tablero están en cada color este mes. El semáforo toma el peor: si hay uno en rojo, se enciende la luz roja.'],
        ['Mirar primero', 'Lista los indicadores en rojo, en el orden en que aparecen más abajo.'],
        ['Colores', 'Cada indicador tiene sus límites de verde y rojo en la pestaña UMBRALES. Gris significa que falta el dato o que es muy pronto para evaluarlo.']]) + '</span><h2>' + tit + '</h2>' +
      '<p>' + (foco.length ? 'Mirar primero: ' + esc(foco.join(', ')) + '.' : d.esActual ? 'Día hábil ' + d.transcurridos + ' de ' + d.totalDias + ' (' + d.mthPct + '% del mes).' : 'Mes cerrado.') + '</p>' +
      '<div class="cuentas">' + ['rojo', 'amarillo', 'verde', 'gris'].filter(function (s) { return cnt[s] || s !== 'gris'; }).map(function (s) {
        return '<span class="s-' + s + '"><span class="foco"></span>' + cnt[s] + ' ' + NOMBRE[s].toLowerCase() + '</span>'; }).join('') + '</div></div></div>';

    var pe = lista.filter(function (it) { return it.key === 'equilibrio'; })[0];
    var f = d.facturacion, base = d.esActual ? f.proyeccion : f.total;
    html += '<div class="preg-box s-' + pe.estado + '"><span class="preg">¿Llegamos al mes? ' + info('¿Llegamos al mes?', [['Qué muestra', 'Si la facturación del mes cubre el punto de equilibrio. Es el mismo número de la tarjeta "' + pe.titulo + '".'], ['Cómo se calcula', (pe.info || {}).calc]]) + '</span>' +
      '<span class="big">' + (pe.valor || '—') + '</span>' +
      '<span class="tit-sub">' + (pe.n != null ? 'del punto de equilibrio con ' + (d.esActual ? 'la proyección al cierre' : 'lo facturado') + ' (' + M(base) + ' de ' + M(f.pe) + ')' : esc(pe.ref)) + '</span>' +
      (pe.n != null ? '<span class="tit-pie"><span class="foco"></span>' + (base >= f.pe ? 'Supera el equilibrio por ' + M(base - f.pe) : 'Faltan ' + M(f.pe - base)) + '</span>' : '') + '</div>';

    var dv = lista.filter(function (it) { return it.key === 'deudaVencida'; })[0];
    var prev = CV.length > 1 ? CV[CV.length - 2] : null, ult = CV.length ? CV[CV.length - 1] : null;
    var cambio = prev && ult && prev.pct != null && ult.pct != null ? (Math.round(ult.pct) === Math.round(prev.pct) ? 'igual que el corte anterior' :
      (ult.pct > prev.pct ? 'subió' : 'bajó') + ' de ' + nf0.format(prev.pct) + '% a ' + nf0.format(ult.pct) + '% desde el ' + F(prev.fecha)) : NOMBRE[dv.estado];
    html += '<div class="preg-box s-' + dv.estado + '"><span class="preg">¿Nos están pagando? ' + info('¿Nos están pagando?', [['Qué muestra', 'Qué parte de la deuda en la calle está vencida, y cómo cambió desde el corte anterior. Es el mismo número de la tarjeta "Deuda en la calle vencida".'], ['Cómo se calcula', (dv.info || {}).calc]]) + '</span>' +
      '<span class="big">' + (dv.valor || '—') + '</span>' +
      '<span class="tit-sub">' + (ult ? 'de la deuda en la calle está vencida (' + M(ult.vencido) + ' de ' + M(ult.total) + ')' : esc(dv.ref)) + '</span>' +
      (ult ? '<span class="tit-pie"><span class="foco"></span>' + esc(cambio) + '</span>' : '') + '</div></section>';
    return html;
  }

  // ---------- Qué cambió esta semana ----------
  /* Compara los dos últimos cortes de BALANCE y DEUDA_VENCIMIENTOS, y la venta de la última semana cerrada
     (lunes a viernes) contra la anterior. Muestra primero lo que cambió de color y después los mayores movimientos. */
  function cambios(CB, CV, H) {
    var cand = [], b1 = CB[CB.length - 1], b0 = CB[CB.length - 2], v1 = CV[CV.length - 1], v0 = CV[CV.length - 2];
    function col(n, key, s) { return color(n, U[key], s); }
    function dir(bueno) { return bueno ? 'verde' : 'rojo'; }
    var CN = { verde: 'verde', amarillo: 'amarillo', rojo: 'rojo', gris: 'sin dato' };
    if (v1 && v0 && v1.pct != null && v0.pct != null) {
      var dp = v1.pct - v0.pct, c0 = col(v0.pct, 'deudaVencida', 'menor'), c1 = col(v1.pct, 'deudaVencida', 'menor');
      cand.push({ score: (c0 !== c1 ? 1000 : 0) + Math.abs(dp) * 4, min: Math.abs(dp) >= 1 || c0 !== c1,
        est: c0 !== c1 ? c1 : dir(dp < 0), fl: dp > 0 ? '▲' : '▼',
        t: c0 !== c1 ? 'Deuda vencida pasó de ' + CN[c0] + ' a ' + CN[c1] : 'Deuda vencida ' + (dp > 0 ? 'subió' : 'bajó') + ' de ' + nf0.format(v0.pct) + '% a ' + nf0.format(v1.pct) + '%',
        s: c0 !== c1 ? 'De ' + nf0.format(v0.pct) + '% a ' + nf0.format(v1.pct) + '%' : 'Vencido ' + M(v0.vencido) + ' → ' + M(v1.vencido) });
      v1.tramos.forEach(function (t, k) {
        var t0 = v0.tramos[k];
        if (!t.venc || !t0 || !t0.valor) return;
        var r = (t.valor - t0.valor) / t0.valor * 100;
        cand.push({ score: Math.abs(r) * 0.6, min: Math.abs(r) >= 15, est: dir(r < 0), fl: r > 0 ? '▲' : '▼',
          t: 'Tramo ' + t.label + ' ' + (r > 0 ? 'creció' : 'bajó') + ' ' + M(Math.abs(t.valor - t0.valor)), s: M(t0.valor) + ' → ' + M(t.valor) });
      });
    }
    if (b1 && b0) {
      if (b1.acido != null && b0.acido != null) {
        var a0 = col(b0.acido, 'acido', 'mayor'), a1 = col(b1.acido, 'acido', 'mayor'), da = (b1.acido - b0.acido) / b0.acido * 100;
        cand.push({ score: (a0 !== a1 ? 1000 : 0) + Math.abs(da), min: Math.abs(da) >= 3 || a0 !== a1, est: a0 !== a1 ? a1 : dir(da > 0), fl: da > 0 ? '▲' : '▼',
          t: a0 !== a1 ? 'Liquidez pasó de ' + CN[a0] + ' a ' + CN[a1] : 'Liquidez ácida ' + (da > 0 ? 'mejoró' : 'empeoró'),
          s: 'De ' + X(b0.acido) + ' a ' + X(b1.acido) });
      }
      [{ k: 'caja', n: 'Caja y bancos', mejor: 1 }, { k: 'cheques', n: 'Ch. en cartera', mejor: 1 }, { k: 'proveedores', n: 'Deuda con proveedores', mejor: -1 }, { k: 'chpropio', n: 'Ch. propio pendiente', mejor: -1 }]
        .forEach(function (x) {
          var p0 = b0.vals[x.k], p1 = b1.vals[x.k];
          if (!p0) return;
          var r = (p1 - p0) / p0 * 100;
          cand.push({ score: Math.abs(r), min: Math.abs(r) >= 5, est: dir(r * x.mejor > 0), fl: r > 0 ? '▲' : '▼',
            t: x.n + ' ' + (r > 0 ? 'subió ' : 'bajó ') + M(Math.abs(p1 - p0)), s: 'De ' + M(p0) + ' a ' + M(p1) });
        });
    }
    // Venta de la última semana cerrada (lunes a viernes, antes de hoy) contra la semana anterior.
    // Solo vendedores con objetivo, igual que la venta del mes.
    var conObj = {};
    H.forEach(function (h) { (h.d.vendedores || []).forEach(function (r) { conObj[r.vendedor] = 1; }); });
    var hoy = new Date(); hoy.setHours(0, 0, 0, 0);
    var vie = new Date(hoy); do { vie.setDate(vie.getDate() - 1); } while (vie.getDay() !== 5);
    var lun = new Date(vie); lun.setDate(vie.getDate() - 4);
    var lunA = new Date(lun); lunA.setDate(lun.getDate() - 7);
    var vieA = new Date(vie); vieA.setDate(vie.getDate() - 7);
    var s1 = 0, s0 = 0;
    ventasPlanas().filas.forEach(function (r) {
      if (!conObj[r.vend]) return;
      var t = new Date(r.f.y, r.f.m - 1, r.f.d);
      if (t >= lun && t <= vie) s1 += r.imp; else if (t >= lunA && t <= vieA) s0 += r.imp;
    });
    function fd(x) { return F({ d: x.getDate(), m: x.getMonth() + 1 }); }
    if (s0 > 0 && s1 > 0) {
      var rv = (s1 - s0) / s0 * 100;
      cand.push({ score: Math.abs(rv), min: Math.abs(rv) >= 10, est: dir(rv > 0), fl: rv > 0 ? '▲' : '▼',
        t: 'Venta de la semana ' + (rv > 0 ? 'subió' : 'bajó') + ' ' + nf0.format(Math.abs(rv)) + '%',
        s: M(s1) + ' del ' + fd(lun) + ' al ' + fd(vie) + ' vs. ' + M(s0) + ' la semana anterior' });
    }
    var lista = cand.filter(function (c) { return c.min; }).sort(function (a, b) { return b.score - a.score; }).slice(0, 4);
    var cab = b1 && b0 ? 'Corte ' + F(b1.fecha) + ' vs. ' + F(b0.fecha) : v1 && v0 ? 'Corte ' + F(v1.fecha) + ' vs. ' + F(v0.fecha) : '';
    var cuerpo;
    if (!(b1 && b0) && !(v1 && v0)) cuerpo = '<p class="vacio-c">Para comparar hacen falta al menos dos cortes cargados en BALANCE o DEUDA_VENCIMIENTOS (una fila por semana, sin pisar la anterior).</p>';
    else if (!lista.length) cuerpo = '<p class="vacio-c">Sin cambios importantes desde el corte anterior.</p>';
    else cuerpo = '<ul>' + lista.map(function (c) {
      return '<li class="s-' + c.est + '"><span class="fl">' + c.fl + '</span><div><b>' + esc(c.t) + '</b><span class="d">' + esc(c.s) + '</span></div></li>';
    }).join('') + '</ul>';
    var expl = info('Qué cambió esta semana', [
      ['Qué compara', 'El último corte de BALANCE y DEUDA_VENCIMIENTOS contra el corte anterior, y la venta de la última semana cerrada (lunes a viernes) contra la semana previa.'],
      ['Qué muestra', 'Hasta 4 cambios: primero los indicadores que cambiaron de color y después los movimientos más grandes. En verde lo que mejoró y en rojo lo que empeoró.'],
      ['Cuándo aparece un cambio', 'Deuda vencida: 1 punto o más. Tramos vencidos: 15% o más. Liquidez: 3% o más. Caja, cheques, proveedores y ch. propio: 5% o más. Venta de la semana: 10% o más (solo vendedores con objetivo).'],
      ['Para que funcione', 'Cada corte tiene que ser una fila nueva con su fecha, sin pisar la anterior.']]);
    return '<section class="cambios" aria-labelledby="t-camb"><div class="cab-linea"><h2 id="t-camb">Qué cambió esta semana ' + expl + '</h2><span class="nota">' + esc(cab) + '</span></div>' + cuerpo + '</section>';
  }

  // ---------- Página ----------
  function cabecera(d) {
    var html = '<header class="cabecera"><div><div class="sup">Control de gestión</div><h1>' + esc(CFG.titulo || 'Tablero de Comando') + '</h1></div><div class="controles">';
    if (d) {
      var hoy = new Date();
      html += '<span>' + (d.esActual ? 'Hoy ' + F({ d: hoy.getDate(), m: hoy.getMonth() + 1 }) + ' · día hábil ' + d.transcurridos + ' de ' + d.totalDias : 'Período cerrado') + '</span>';
      html += '<select id="sel-mes" aria-label="Mes">' + d.meses.map(function (m) {
        var p = m.split('-');
        return '<option value="' + m + '"' + (m === d.mes ? ' selected' : '') + '>' + C.MESES[+p[1] - 1] + ' ' + p[0] + '</option>';
      }).join('') + '</select>';
    }
    return html + '<button id="btn-act" type="button">Actualizar</button></div></header>';
  }

  function inflacion() {
    try { var s = localStorage.getItem('tablero.inflacion'); if (s != null && isFinite(+s)) return +s; } catch (e) {}
    return +CFG.inflacion || 0;
  }

  function dibujar() {
    var html = '';
    if (estado.error) {
      html = cabecera(null) + '<div class="error"><b>No se pudieron cargar los datos.</b><span>' + esc(estado.error) + '</span></div>';
    } else if (!estado.tablas) {
      html = '<div class="vacio">Cargando datos…</div>';
    } else {
      try {
        var avU = aplicarUmbrales(estado.tablas.umbrales);
        var opc = { puntoEquilibrio: CFG.puntoEquilibrio, inflacion: inflacion() / 100 };
        var d = C.calcular(estado.tablas, estado.mes, opc);
        estado.mes = d.mes;
        var H = historia(d, opc);
        var CB = cortesBalance(estado.tablas.balance), CV = cortesVenc(estado.tablas.vencimientos);
        var lista = indicadores(d, H, CB, CV).sort(function (x, y) { return PESO[x.estado] - PESO[y.estado] || x.orden - y.orden; });
        var avisos = estado.avisos.concat(d.avisos, avU);
        html = cabecera(d) +
          (window.SEMAFORO_DEMO ? '<div class="aviso">Vista previa con datos de ejemplo. Publicada en Vercel, esta página lee las mismas planillas que el tablero.</div>' : '') +
          titular(lista, d, CV) +
          (avisos.length ? '<div class="aviso">' + avisos.map(esc).join('<br>') + '</div>' : '') +
          cambios(CB, CV, H) +
          focoVista(lista, d, H) +
          bloques(lista, d, H) +
          '<p class="pie">' + ({ planilla: 'Umbrales: pestaña UMBRALES', mixto: 'Umbrales: pestaña UMBRALES (los que faltan, por defecto)', defecto: tb.umbrales ? 'Umbrales por defecto (revisá la pestaña UMBRALES)' : 'Umbrales por defecto' })[ORIGEN_U] +
          ' · Comercial y clientes: VentasTrack · Financiero: planilla del tablero' + (estado.leido ? ' · Leído a las ' + hora(estado.leido) : '') +
          ' · <a href="detalle.html">Ver el tablero anterior</a></p>';
      } catch (e) {
        html = cabecera(null) + '<div class="error"><b>Hay un problema con los datos.</b><span>' + esc(e.message) + '</span></div>';
      }
    }
    app.innerHTML = html;
    var sel = document.getElementById('sel-mes');
    if (sel) sel.addEventListener('change', function () { estado.mes = sel.value; dibujar(); });
    var btn = document.getElementById('btn-act');
    if (btn) btn.addEventListener('click', function () { btn.disabled = true; btn.textContent = 'Actualizando…'; cargar(); });
    var inp = document.getElementById('inp-infl');
    if (inp) {
      inp.addEventListener('click', function (ev) { ev.stopPropagation(); });
      inp.addEventListener('change', function () {
        var v = parseFloat(String(inp.value).replace(',', '.'));
        if (!isFinite(v) || v < 0) v = 0;
        try { localStorage.setItem('tablero.inflacion', String(v)); } catch (e) {}
        dibujar();
      });
    }
  }

  // Abrir y cerrar el detalle de una tarjeta (clic, Enter o espacio).
  function alternar(key) {
    var abre = !estado.abiertas[key];
    estado.abiertas = {};
    if (abre) estado.abiertas[key] = true;
    dibujar();
    var fv = document.getElementById('foco-vista');
    if (fv) fv.scrollIntoView({ behavior: 'smooth', block: 'start' });
    var card = app.querySelector('.luz[data-key="' + key + '"] .luz-btn');
    if (card) card.focus({ preventScroll: true });
  }
  app.addEventListener('click', function (ev) {
    if (!ev.target.closest) return;
    var inf = ev.target.closest('.info');
    app.querySelectorAll('.info.ver').forEach(function (x) { if (x !== inf) x.classList.remove('ver'); });
    if (inf) {
      if (ev.target.closest('.info-btn')) inf.classList.toggle('ver');
      return;
    }
    var btn = ev.target.closest('.luz-btn');
    if (btn) alternar(btn.parentNode.getAttribute('data-key'));
  });
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape') app.querySelectorAll('.info.ver').forEach(function (x) { x.classList.remove('ver'); });
  });
  app.addEventListener('keydown', function (ev) {
    if (ev.key !== 'Enter' && ev.key !== ' ') return;
    var btn = ev.target.classList && ev.target.classList.contains('luz-btn') ? ev.target : null;
    if (!btn) return;
    ev.preventDefault();
    alternar(btn.parentNode.getAttribute('data-key'));
  });

  cargar();
  var min = +CFG.refrescoMinutos;
  if (min > 0 && !window.SEMAFORO_DEMO) setInterval(cargar, min * 60000);
})();
  </script>
</body>
</html>
