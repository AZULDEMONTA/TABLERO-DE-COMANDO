<head>

  <title>Tablero de Comando</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <style>
/* Estilo "Sala de control": fondo oscuro, acento verde lima, números monoespaciados. */
:root {
  color-scheme: dark;
  --fondo: #0D1117;
  --tarjeta: #151B23;
  --suave: #0F141B;
  --tinta: #E6EDF3;
  --tenue: #9AA7B5;
  --gris: #9AA7B5;
  --borde: #242C38;
  --linea: #1C232D;
  --pista: #242C38;
  --acento: #C6F432;
  --acento-claro: #3B4757;
  --acento-suave: rgba(198, 244, 50, .12);
  --ambar: #FFB547;
  --coral: #FF8A7A;
  --mono: 'DM Mono', ui-monospace, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--fondo); }
body { font-family: 'Space Grotesk', system-ui, sans-serif; color: var(--tinta); -webkit-font-smoothing: antialiased; }
.pagina { max-width: 1240px; margin: 0 auto; padding: 40px 16px 64px; display: flex; flex-direction: column; gap: 24px; }
.mono { font-family: var(--mono); }
h1, h2, h3 { margin: 0; }

.cabecera { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px; }
.cabecera .sup { font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: var(--acento); }
.cabecera h1 { font-size: 36px; font-weight: 700; letter-spacing: -.02em; margin-top: 6px; }
.controles { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; font-family: var(--mono); font-size: 13px; color: var(--tenue); }
.controles select, .controles button {
  font: inherit; color: var(--tinta); background: var(--tarjeta);
  border: 1px solid #2A3340; border-radius: 6px; padding: 9px 12px; min-height: 40px;
}
.controles button { cursor: pointer; color: var(--acento); }
.controles button:hover, .controles select:hover { border-color: var(--acento); }
.pastilla { border: 1px solid #2A3340; border-radius: 6px; padding: 9px 12px; }

.tarjeta { background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 8px; padding: 28px; display: flex; flex-direction: column; gap: 22px; }
.titulo-sec { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
.titulo-sec h2 { font-size: 14px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--tenue); }
.titulo-sec .nota { font-family: var(--mono); font-size: 13px; color: var(--tenue); }
.etiqueta { font-size: 12px; font-weight: 600; border: 1px solid currentColor; border-radius: 999px; padding: 4px 12px; }
.ok { color: var(--acento); }
.warn { color: var(--ambar); }
.bad { color: var(--coral); }

.fila { display: flex; flex-wrap: wrap; gap: 16px; }
.kpi { flex: 1 1 240px; background: var(--suave); border: 1px solid transparent; border-radius: 6px; padding: 20px; display: flex; flex-direction: column; gap: 8px; }
.kpi.destacado { border-color: var(--acento); }
.kpi.destacado .rot { color: var(--acento); }
.rot { font-size: 13px; color: var(--tenue); }
.sub { font-size: 13px; color: var(--tenue); }
.num { font-family: var(--mono); font-weight: 500; letter-spacing: -.02em; }
.n34 { font-size: 40px; }
.n52 { font-size: 64px; line-height: 1; letter-spacing: -.03em; }
.n26 { font-size: 26px; }
.n30 { font-size: 28px; }
.n38 { font-size: 38px; }
.n20 { font-size: 22px; }
.n24 { font-size: 24px; }

.col-div { flex: 1 1 180px; display: flex; flex-direction: column; gap: 4px; }
.col-grande { flex: 2 1 300px; display: flex; flex-direction: column; gap: 4px; }
.col-div .pe, .pe { color: var(--ambar); }

.barra { position: relative; height: 10px; background: var(--pista); border-radius: 2px; }
.barra.alta { height: 18px; }
.barra .relleno { position: absolute; left: 0; top: 0; bottom: 0; background: var(--acento); border-radius: 2px; min-width: 3px; }
.barra .marca { position: absolute; top: -6px; bottom: -6px; width: 3px; margin-left: -1px; }
.barra .marca.hoy { background: var(--tinta); width: 2px; }
.barra .marca.pe { background: var(--ambar); top: -8px; bottom: -8px; }
.barra .marca.obj { background: var(--tinta); top: -8px; bottom: -8px; }
.barra .marca.proy { width: 0; border-left: 2px dashed var(--tenue); top: 0; bottom: 0; background: none; }
.leyenda { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; font-family: var(--mono); font-size: 12px; text-transform: uppercase; color: var(--tenue); }
.leyenda b { color: var(--tinta); font-weight: 500; }
.sw { display: inline-block; width: 10px; height: 10px; margin-right: 6px; vertical-align: 0; }

.ritmo { display: flex; flex-direction: column; gap: 10px; }
.ritmo .tit { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--acento); }
.ritmo .fila { gap: 1px; background: var(--borde); border: 1px solid var(--borde); border-radius: 6px; overflow: hidden; }
.ritmo .item { flex: 1 1 200px; background: var(--tarjeta); padding: 16px 18px; display: flex; flex-direction: column; gap: 4px; }
.ritmo .item .rot, .ritmo .item .sub { font-size: 12px; }
.neg { color: var(--coral); }
.pos { color: var(--acento); }

/* Comparativa anual */
.graf-scroll { overflow-x: auto; }
.graf { min-width: 640px; display: flex; flex-direction: column; gap: 8px; }
.graf .barras { display: flex; align-items: flex-end; gap: 12px; height: 240px; border-bottom: 1px solid #2A3340; padding: 0 4px; }
.graf .mes { flex: 1 1 0; display: flex; align-items: flex-end; justify-content: center; gap: 3px; height: 100%; }
.graf .b { width: 40%; position: relative; }
.graf .b.ant { background: var(--acento-claro); }
.graf .b.act { background: var(--acento); }
.graf .pila { width: 40%; height: 100%; position: relative; }
.graf .pila .b { position: absolute; left: 0; right: 0; bottom: 0; width: auto; }
.graf .pila .proy { position: absolute; left: 0; right: 0; bottom: 0; border: 2px dashed var(--acento); border-bottom: none; background: transparent; }
.graf .etis { display: flex; gap: 12px; padding: 0 4px; }
.graf .etis span { flex: 1 1 0; text-align: center; font-family: var(--mono); font-size: 12px; text-transform: uppercase; color: var(--tenue); }
.graf .vars { display: flex; gap: 12px; padding: 0 4px; }
.graf .vars span { flex: 1 1 0; text-align: center; font-size: 11px; font-family: var(--mono); }

/* Situación financiera */
.sec-fin { display: flex; flex-direction: column; gap: 16px; }
.sec-fin > .titulo-sec { padding: 8px 4px 0; }
.mini { flex: 1 1 260px; background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 8px; padding: 18px 20px; display: flex; flex-direction: column; gap: 6px; }
.tramos-barra { display: flex; height: 14px; border-radius: 2px; overflow: hidden; gap: 2px; background: var(--pista); }
.tramo { flex: 1 1 200px; display: flex; flex-direction: column; gap: 4px; border-top: 3px solid; padding-top: 10px; }
.tabla { flex: 1 1 400px; background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 8px; padding: 8px 24px 16px; }
.tabla .enc { padding: 14px 0; border-bottom: 1px solid var(--borde); font-size: 13px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--tenue); }
.tabla .reng { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--linea); font-size: 14px; }
.tabla .reng .num { font-weight: 400; white-space: nowrap; }
.tabla .tot { display: flex; justify-content: space-between; padding: 14px 0 4px; font-weight: 700; font-size: 15px; }
.tag { font-size: 11px; color: var(--acento); background: var(--acento-suave); border-radius: 4px; padding: 2px 6px; margin-left: 8px; white-space: nowrap; }
.bal { flex: 1 1 400px; background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 8px; padding: 22px 24px; display: flex; flex-direction: column; gap: 6px; }
.bal .cab { display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: 600; }
.rojo { color: var(--coral); }

.aviso { background: rgba(255, 181, 71, .1); border: 1px solid rgba(255, 181, 71, .4); color: var(--ambar); border-radius: 6px; padding: 12px 16px; font-size: 13px; }
.error { background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 8px; padding: 28px; display: flex; flex-direction: column; gap: 12px; }
.error b { color: var(--coral); }
.vacio { font-size: 14px; color: var(--tenue); }
.pie { font-family: var(--mono); font-size: 12px; color: var(--tenue); text-align: center; }

/* Bloques con el formato de VentasTrack */
:root { --vendido: #7AA2FF; --facturado: #C6F432; --facturable: #B794F6; }
.c-ok { color: var(--acento); }
.c-warn { color: var(--ambar); }
.c-bad { color: var(--coral); }
.c-mes { color: var(--vendido); }
.relleno.c-ok { background: var(--acento); }
.relleno.c-warn { background: var(--ambar); }
.relleno.c-bad { background: var(--coral); }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.k { background: var(--suave); border: 1px solid var(--borde); border-radius: 6px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.k.b-ok { border-color: rgba(198, 244, 50, .35); }
.k.b-bad { border-color: rgba(255, 138, 122, .4); }
.k.k-ancho { grid-column: span 2; }
.k-rot { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--tenue); }
.k-val { font-family: var(--mono); font-size: 22px; font-weight: 500; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.k-val.pe { color: var(--ambar); }
.k-sub { font-size: 12px; color: var(--tenue); }
.avance { background: var(--suave); border: 1px solid var(--borde); border-radius: 6px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; }
.avance .titulo-sec b { font-size: 15px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--tenue); }
.chips b { font-family: var(--mono); font-weight: 500; color: var(--tinta); }
.chips b.c-ok { color: var(--acento); } .chips b.c-warn { color: var(--ambar); } .chips b.c-bad { color: var(--coral); }
.composicion { display: flex; height: 12px; border-radius: 2px; overflow: hidden; gap: 2px; background: var(--pista); }
.bf { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.bf > div { background: var(--suave); border-radius: 6px; border-left: 3px solid; padding: 12px 14px; display: flex; flex-direction: column; gap: 3px; }
.vend { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 12px; }
.v { background: var(--suave); border: 1px solid var(--borde); border-left: 3px solid; border-radius: 6px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.v-cab { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.v-cab > div:first-child { display: flex; flex-direction: column; gap: 2px; }
.v-der { display: flex; align-items: center; gap: 12px; text-align: right; }
.infl { display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 13px; color: var(--tenue); }
.infl input { width: 76px; font: inherit; color: var(--tinta); background: var(--suave); border: 1px solid var(--acento); border-radius: 6px; padding: 8px 10px; min-height: 40px; text-align: right; }
.graf3 .mes { gap: 2px; }
.graf3 .b, .graf3 .pila { width: 28%; }
.graf .b.aj { background: var(--ambar); }
.graf .vars em { flex: 0 0 64px; font-style: normal; font-size: 11px; color: var(--tenue); text-align: left; }
.graf .vars { padding-left: 0; }
.graf3 .etis { padding-left: 76px; }
.graf3 .barras { padding-left: 76px; }
@media (max-width: 640px) { .k.k-ancho { grid-column: auto; } .vend { grid-template-columns: 1fr; } }

@media (max-width: 640px) {
  .tarjeta { padding: 20px; }
  .n52 { font-size: 44px; }
  .n34 { font-size: 30px; }
}
  </style>
</head>

  <script>
/* Lectura de las planillas y cálculos. Sin dependencias (corre también en Node para pruebas). */
(function (root) {
  'use strict';

  var MESES = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio',
    'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
  var MESES_CORTO = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];

  var RUBROS = [
    { key: 'caja', label: 'Caja y bancos', alias: ['caja y bancos', 'caja'], lado: 'activo', acido: true },
    { key: 'cheques', label: 'Ch. en cartera', alias: ['ch en cartera', 'cheques en cartera'], lado: 'activo', acido: true },
    { key: 'cobrar', label: 'Cuentas a cobrar', alias: ['cuentas a cobrar', 'deuda en la calle'], lado: 'activo', acido: true },
    { key: 'stock', label: 'Stock (a valor compra)', alias: ['stock valor compra', 'stock a valor compra', 'stock al costo', 'stock costo', 'stock valor venta', 'stock a valor venta', 'stock'], lado: 'activo', acido: false },
    { key: 'vehiculos', label: 'Vehículos', alias: ['vehiculos mm', 'vehiculos'], lado: 'activo', acido: false },
    { key: 'inmueble', label: 'Inmueble Juncal 1871', alias: ['inmueble juncal 1871', 'inmueble'], lado: 'activo', acido: false },
    { key: 'chpropio', label: 'Ch. propio pendiente', alias: ['ch propio pendiente', 'ch propio pen', 'cheque propio pendiente', 'ch propio'], lado: 'pasivo', acido: true },
    { key: 'proveedores', label: 'Proveedores', alias: ['proveedores', 'deuda con proveedores'], lado: 'pasivo', acido: true },
    { key: 'fiscales', label: 'Deudas fiscales', alias: ['deudas fiscales'], lado: 'pasivo', acido: false },
    { key: 'prestamos', label: 'Préstamos bancarios', alias: ['prestamos bancarios'], lado: 'pasivo', acido: false },
    { key: 'dividendos', label: 'Dividendos y fondo líquido pendiente', alias: ['dividendos y fondo liquido pendiente', 'dividendos'], lado: 'pasivo', acido: false },
    { key: 'empleados', label: 'Deudas con los empleados', alias: ['deudas con los empleados', 'deudas con empleados'], lado: 'pasivo', acido: false },
    { key: 'hipotecarias', label: 'Deudas hipotecarias', alias: ['deudas hipotecarias'], lado: 'pasivo', acido: false },
    { key: 'socios', label: 'Deudas con los socios', alias: ['deudas con los socios', 'deudas con socios'], lado: 'pasivo', acido: false }
  ];

  function norm(s) {
    return String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '')
      .toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
  }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function sum(a) { return a.reduce(function (x, y) { return x + y; }, 0); }

  // CSV (RFC 4180): comillas, comas dentro de comillas, saltos CRLF.
  function parseCSV(text) {
    var rows = [], row = [], field = '', inQ = false, i = 0, c;
    text = String(text || '').replace(/^﻿/, '');
    while (i < text.length) {
      c = text[i];
      if (inQ) {
        if (c === '"') {
          if (text[i + 1] === '"') { field += '"'; i += 2; continue; }
          inQ = false; i++; continue;
        }
        field += c; i++; continue;
      }
      if (c === '"') { inQ = true; i++; continue; }
      if (c === ',') { row.push(field); field = ''; i++; continue; }
      if (c === '\r') { i++; continue; }
      if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; i++; continue; }
      field += c; i++;
    }
    if (field !== '' || row.length) { row.push(field); rows.push(row); }
    return rows.filter(function (r) { return r.some(function (v) { return String(v).trim() !== ''; }); });
  }

  // Importes de VentasTrack: mismo criterio que usa VentasTrack, para que los totales coincidan.
  function parseAmt(raw) {
    if (typeof raw === 'number') return raw;
    var s = String(raw == null ? '' : raw).trim().replace(/[$\s\r]/g, '').replace(/[−–]/g, '-');
    if (!s || s === '-') return null;
    var neg = false;
    if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
    if (s.slice(-1) === '-') { neg = true; s = s.slice(0, -1); }
    if (s[0] === '-') { neg = !neg; s = s.slice(1); }
    if (!s) return null;
    if (s.indexOf(',') !== -1 && s.indexOf('.') === -1) s = s.replace(',', '.');
    else if (s.indexOf(',') !== -1 && s.indexOf('.') !== -1) s = s.replace(/\./g, '').replace(',', '.');
    else s = s.replace(/\./g, '');
    var v = parseFloat(s);
    if (!isFinite(v)) return null;
    return neg ? -v : v;
  }

  // Importes de la planilla del tablero ("12.600.000", "1.234,56", con $ o negativos).
  function parseNum(v) {
    if (v == null) return null;
    if (typeof v === 'number') return isFinite(v) ? v : null;
    var s = String(v).trim();
    if (!s || s === '-' || s === '—') return null;
    var neg = false;
    if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
    s = s.replace(/[$\s ]/g, '');
    if (s[0] === '-' || s[0] === '−') { neg = true; s = s.slice(1); }
    var lastDot = s.lastIndexOf('.'), lastComma = s.lastIndexOf(',');
    if (lastDot > -1 && lastComma > -1) {
      s = lastComma > lastDot ? s.replace(/\./g, '').replace(',', '.') : s.replace(/,/g, '');
    } else if (lastComma > -1) {
      s = /^\d{1,3}(,\d{3})+$/.test(s) ? s.replace(/,/g, '') : s.replace(',', '.');
    } else if (lastDot > -1) {
      if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
    }
    if (!/^\d*\.?\d+$/.test(s)) return null;
    var n = Number(s);
    return isFinite(n) ? (neg ? -n : n) : null;
  }

  function mkDate(y, m, d) {
    if (y < 100) y += 2000;
    if (m < 1 || m > 12 || d < 1 || d > 31) return null;
    return { y: y, m: m, d: d, key: y + '-' + pad(m) + '-' + pad(d), mes: y + '-' + pad(m) };
  }
  // Fechas dd/mm/aaaa o aaaa-mm-dd (ignora la hora).
  function parseDate(v) {
    var s = String(v == null ? '' : v).trim().split(/[ T]/)[0];
    var m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
    if (m) return mkDate(+m[3], +m[2], +m[1]);
    m = s.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})$/);
    if (m) return mkDate(+m[1], +m[2], +m[3]);
    return null;
  }

  // "Octubre", "oct", "10", "setiembre" → 0..11

  // Diferencia entre dos porcentajes, en palabras: "0,8 puntos por debajo".
  function puntos(f) {
    if (f == null || !isFinite(f)) return '—';
    if (Math.abs(f) < 0.0005) return 'En línea con lo esperado';
    return nf1.format(Math.abs(f) * 100) + (f < 0 ? ' puntos por debajo' : ' puntos por encima');
  }
  function VAR(f) { return f == null || !isFinite(f) ? '—' : (f >= 0 ? '+' : '−') + nf1.format(Math.abs(f) * 100) + '%'; }
  function X(v) { return v == null || !isFinite(v) ? '—' : nf2.format(v); }
  function F(d, anio) { return d ? (d.d < 10 ? '0' : '') + d.d + '/' + (d.m < 10 ? '0' : '') + d.m + (anio ? '/' + d.y : '') : '—'; }
  function hora(t) { return t ? t.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' }) : ''; }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function pc(f) { return Math.max(0, Math.min(100, (f || 0) * 100)); }
  // Importe completo, mismo formato que VentasTrack: $265.722.552
  function fmt(n) {
    if (n == null || !isFinite(n)) return '—';
    return (n < 0 ? '-$' : '$') + Math.abs(Math.round(n)).toLocaleString('es-AR');
  }

  // ---------- Lectura ----------
  function leer(f) {
    var u = f.url + (f.url.indexOf('?') > -1 ? '&' : '?') + '_t=' + Date.now();
    var ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    var timer = ctrl ? setTimeout(function () { ctrl.abort(); }, 20000) : null;
    return fetch(u, { cache: 'no-store', signal: ctrl ? ctrl.signal : undefined }).then(function (r) {
      clearTimeout(timer);
      if (!r.ok) throw new Error('No se pudo leer la pestaña ' + f.nombre + ' (error ' + r.status + ').');
      return r.text();
    }).then(function (txt) {
      if (/^\s*<(!doctype|html)/i.test(txt)) throw new Error('La pestaña ' + f.nombre + ' no devolvió un CSV. Revisá que esté publicada en la web.');
      return C.parseCSV(txt);
    }, function (e) {
      if (e && /pestaña/.test(e.message)) throw e;
      throw new Error('No se pudo conectar con la pestaña ' + f.nombre + '. Revisá la conexión.');
    });
  }

  function cargar() {
    var avisos = [];
    return Promise.all(FUENTES.map(function (f) {
      var p = leer(f);
      return f.obligatoria ? p : p.catch(function (e) { avisos.push(e.message); return null; });
    })).then(function (res) {
      var t = {};
      FUENTES.forEach(function (f, i) { t[f.key] = res[i]; });
      estado.tablas = t; estado.avisos = avisos; estado.leido = new Date(); estado.error = null;
    }).catch(function (e) {
      estado.error = e.message || String(e);
    }).then(dibujar);
  }

  // ---------- Piezas ----------
  function etiqueta(clase, texto) { return '<span class="etiqueta ' + clase + '">' + esc(texto) + '</span>'; }
  // Colores de avance, igual que VentasTrack: ≥100% verde, ≥70% ámbar, menos rojo.
  function sc(p) { return p >= 100 ? 'c-ok' : p >= 70 ? 'c-warn' : 'c-bad'; }
  function signo(n) { return (n >= 0 ? '+' : '') + n; }
  function k(rot, val, sub, clase, borde) {
    return '<div class="k' + (borde ? ' ' + borde : '') + '"><span class="k-rot">' + rot + '</span>' +
      '<span class="k-val' + (clase ? ' ' + clase : '') + '">' + val + '</span>' + (sub ? '<span class="k-sub">' + sub + '</span>' : '') + '</div>';
  }
  function chip(rot, val, clase) { return '<span>' + rot + ': <b class="' + (clase || '') + '">' + val + '</b></span>'; }
  function barraAvance(p, mthPct, clase, color) {
    return '<div class="barra" role="img" aria-label="Avance ' + p + '% contra ' + mthPct + '% del mes">' +
      '<div class="relleno ' + (clase || '') + '" style="width:' + Math.min(100, p) + '%' + (color ? ';background:' + color : '') + '"></div>' +
      '<div class="marca hoy" style="left:' + Math.min(100, mthPct) + '%" title="Mes transcurrido ' + mthPct + '%"></div></div>';
  }

  // ---------- Secciones ----------
  function secEmpresa(d) {
    var e = d.empresa, f = d.facturacion, bo = f.backorder;
    var html = '<section class="tarjeta" aria-labelledby="t-emp"><div class="titulo-sec"><h2 id="t-emp">Venta · Empresa</h2>' +
      (e.objetivo ? (e.diff >= 0 ? etiqueta('ok', 'En ritmo') : etiqueta('bad', 'Por debajo del ritmo')) : '') + '</div>';
    html += '<div class="kv">' +
      k('Venta del día', fmt(e.ventaDia), d.esActual ? (e.fechaDia ? 'Última carga ' + F(e.fechaDia) : 'Sin ventas cargadas') : 'Período cerrado') +
      k('Venta total', fmt(e.total), d.mesCorto) +
      k('Objetivo', fmt(e.objetivo), 'suma vendedores') +
      k('Avance', signo(e.diff) + '%', '<span class="' + sc(e.p) + '">' + e.p + '%</span> vs <span class="c-mes">' + d.mthPct + '%</span> mes',
        e.diff >= 0 ? 'c-ok' : 'c-bad', e.diff >= 0 ? 'b-ok' : 'b-bad') +
      k('Días hábiles', d.transcurridos + '/' + d.totalDias, d.restantes + ' restantes') +
      k('Backorder', fmt(Math.max(0, bo)), f.boPct + '% del vendido', bo > 0 ? 'c-bad' : 'c-ok', bo > 0 ? 'b-bad' : 'b-ok') +
      '</div>';
    html += '<div class="avance"><div class="titulo-sec"><b>Avance global</b><span class="num n30 ' + sc(e.p) + '">' + e.p + '%</span></div>' +
      '<span class="sub">' + fmt(e.total) + ' / ' + fmt(e.objetivo) + '</span>' +
      barraAvance(e.p, d.mthPct, sc(e.p)) +
      '<div class="chips">' +
      chip('Venta faltante', fmt(Math.max(0, e.gap))) +
      chip('Venta diaria', fmt(e.dailyAvg)) +
      (e.gap > 0 && d.restantes > 0 ? chip('Venta prom. faltante', fmt(e.dailyNeed) + '/día', e.dailyNeed <= e.dailyAvg ? 'c-ok' : 'c-warn') : '') +
      chip('vs ritmo', (e.vsExp >= 0 ? '+' : '') + fmt(e.vsExp), e.vsExp >= 0 ? 'c-ok' : 'c-bad') +
      (d.esActual ? chip('Proyección al cierre', fmt(e.proyeccion)) : '') +
      '</div><span class="k-sub">La línea blanca marca el % del mes transcurrido (' + d.mthPct + '%).</span></div>';
    return html + '</section>';
  }

  function secFacturable(d) {
    var e = d.empresa, f = d.facturacion, bo = f.backorder;
    var html = '<section class="tarjeta" aria-labelledby="t-fb"><div class="titulo-sec"><h2 id="t-fb">Facturado · Facturable · Backorder</h2>' +
      '<span class="nota">Sobre lo vendido en ' + esc(d.mesCorto) + '</span></div>';
    var tv = e.total || 1;
    html += '<div class="composicion" role="img" aria-label="Composición de lo vendido">' +
      (f.facturado > 0 ? '<div style="width:' + Math.min(100, f.facturado / tv * 100) + '%;background:var(--facturado)"></div>' : '') +
      (f.facturable > 0 ? '<div style="width:' + Math.min(100, f.facturable / tv * 100) + '%;background:var(--facturable)"></div>' : '') +
      (bo > 0 ? '<div style="width:' + Math.min(100, bo / tv * 100) + '%;background:var(--coral)"></div>' : '') + '</div>';
    html += '<div class="bf">' +
      '<div style="border-left-color:var(--vendido)"><span class="k-rot">Vendido</span><span class="k-val" style="color:var(--vendido)">' + fmt(e.total) + '</span><span class="k-sub">100%</span></div>' +
      '<div style="border-left-color:var(--facturado)"><span class="k-rot">Facturado</span><span class="k-val" style="color:var(--facturado)">' + fmt(f.facturado) + '</span><span class="k-sub">' + (e.total ? f.pFacturado + '%' : '—') + '</span></div>' +
      '<div style="border-left-color:var(--facturable)"><span class="k-rot">Facturable</span><span class="k-val" style="color:var(--facturable)">' + fmt(f.facturable) + '</span><span class="k-sub">' + (e.total ? f.pFacturable + '%' : '—') + '</span></div>' +
      '<div style="border-left-color:' + (bo > 0 ? 'var(--coral)' : 'var(--acento)') + '"><span class="k-rot">Backorder</span><span class="k-val ' + (bo > 0 ? 'c-bad' : 'c-ok') + '">' + fmt(Math.abs(bo)) + '</span><span class="k-sub">' + (bo > 0 ? f.boPct + '% sin destino' : 'todo asignado') + '</span></div>' +
      '</div>';
    return html + '</section>';
  }

  function secFacturacion(d) {
    var f = d.facturacion, tg = d.empresa.objetivo;
    var html = '<section class="tarjeta" aria-labelledby="t-fact"><div class="titulo-sec"><h2 id="t-fact">Facturación vs. objetivo y punto de equilibrio</h2>';
    if (!f.hayDato) {
      return html + '</div><p class="vacio" style="margin:0">Todavía no hay facturación cargada en VentasTrack para ' + esc(d.mesNombre) + '.</p></section>';
    }
    if (tg && f.proyeccion != null) {
      html += f.proyeccion >= tg ? etiqueta('ok', 'Alcanza el objetivo al ritmo actual')
        : f.pe && f.proyeccion >= f.pe ? etiqueta('warn', 'Cubre el equilibrio, no el objetivo')
        : etiqueta('bad', 'No cubre el equilibrio al ritmo actual');
    }
    html += '</div><div class="kv">' +
      k('Facturación del mes', fmt(f.total), 'Facturado ' + fmt(f.facturado) + ' + facturable ' + fmt(f.facturable), '', 'k-ancho') +
      k('Objetivo', fmt(tg), 'Falta facturar ' + fmt(Math.max(0, f.gap))) +
      k('Avance', signo(f.diff) + '%', '<span class="' + sc(f.p) + '">' + f.p + '%</span> vs <span class="c-mes">' + d.mthPct + '%</span> mes',
        f.diff >= 0 ? 'c-ok' : 'c-bad', f.diff >= 0 ? 'b-ok' : 'b-bad') +
      k('Punto de equilibrio', fmt(f.pe), f.pe ? (f.peFaltan > 0 ? 'Faltan ' + fmt(f.peFaltan) : 'Cubierto') : '—', 'pe') +
      (d.esActual ? k('Proyección al cierre', fmt(f.proyeccion), tg ? Math.round(f.proyeccion / tg * 100) + '% del objetivo' : '') : '') +
      '</div>';
    if (tg) {
      var escala = Math.max(tg, f.pe || 0, f.proyeccion || 0, f.total || 0);
      var x = function (v) { return Math.max(0, Math.min(100, v / escala * 100)); };
      html += '<div class="avance"><div class="barra alta" role="img" aria-label="Facturación ' + fmt(f.total) + ', equilibrio ' + fmt(f.pe) + ', objetivo ' + fmt(tg) + '">' +
        '<div class="relleno ' + sc(f.p) + '" style="width:' + x(f.total) + '%"></div>' +
        (d.esActual && f.proyeccion != null ? '<div class="marca proy" style="left:' + x(f.proyeccion) + '%"></div>' : '') +
        '<div class="marca hoy" style="left:' + x(tg * d.mthPct / 100) + '%"></div>' +
        (f.pe ? '<div class="marca pe" style="left:' + x(f.pe) + '%"></div>' : '') +
        '<div class="marca obj" style="left:' + x(tg) + '%"></div></div>' +
        '<div class="leyenda"><span><span class="sw" style="background:var(--acento)"></span>Facturado + facturable ' + f.p + '%</span>' +
        '<span>│ Esperado a hoy ' + d.mthPct + '%</span>' +
        (d.esActual ? '<span>┆ Proyección ' + Math.round(f.proyeccion / tg * 100) + '%</span>' : '') +
        (f.pe ? '<span><span class="sw" style="background:var(--ambar)"></span>Equilibrio ' + Math.round(f.pe / tg * 100) + '%</span>' : '') +
        '<span><span class="sw" style="background:var(--tinta)"></span>Objetivo 100%</span></div>' +
        '<div class="chips">' +
        chip('Falta facturar', fmt(Math.max(0, f.gap))) +
        chip('Facturación diaria', fmt(f.dailyAvg)) +
        (f.gap > 0 && d.restantes > 0 ? chip('Prom. faltante', fmt(f.dailyNeed) + '/día', f.dailyNeed <= f.dailyAvg ? 'c-ok' : 'c-warn') : '') +
        chip('vs ritmo', (f.vsExp >= 0 ? '+' : '') + fmt(f.vsExp), f.vsExp >= 0 ? 'c-ok' : 'c-bad') +
        (f.pe && d.esActual ? chip('Equilibrio al ritmo actual', f.peAlcanzable ? 'Se alcanza' : 'No se alcanza', f.peAlcanzable ? 'c-ok' : 'c-bad') : '') +
        '</div></div>';
    }
    return html + '</section>';
  }

  var COLORES_VEND = ['#7AA2FF', '#C6F432', '#B794F6', '#4FD1C5', '#FFB547', '#FF8A7A', '#F472B6', '#94A3B8'];
  function secVendedores(d) {
    if (!d.vendedores.length) return '';
    var html = '<section class="tarjeta" aria-labelledby="t-vend"><div class="titulo-sec"><h2 id="t-vend">Vendedores</h2>' +
      '<span class="nota">Mes transcurrido ' + d.mthPct + '%</span></div><div class="vend">';
    d.vendedores.forEach(function (r) {
      var color = COLORES_VEND[r.idx % COLORES_VEND.length];
      html += '<div class="v" style="border-left-color:' + color + '">' +
        '<div class="v-cab"><div><b>' + esc(r.vendedor) + '</b><span class="k-sub">' + fmt(r.total) + ' / ' + fmt(r.goal) + '</span></div>' +
        '<div class="v-der"><span class="k-sub">mes: <span class="c-mes">' + d.mthPct + '%</span><br>diff: <b class="' + (r.diff >= 0 ? 'c-ok' : 'c-bad') + '">' + signo(r.diff) + '%</b></span>' +
        '<span class="num n24 ' + sc(r.p) + '">' + r.p + '%</span></div></div>' +
        barraAvance(r.p, d.mthPct, '', color) +
        '<div class="chips">' +
        chip('Venta diaria', fmt(r.dailyAvg)) +
        chip('Venta faltante', fmt(Math.max(0, r.gap))) +
        (r.gap > 0 && d.restantes > 0 ? chip('Prom. faltante', fmt(r.dailyNeed) + '/día', r.dailyNeed <= r.dailyAvg ? 'c-ok' : 'c-warn') : '') +
        (r.vsExp !== 0 ? chip('vs ritmo', (r.vsExp >= 0 ? '+' : '') + fmt(r.vsExp), r.vsExp >= 0 ? 'c-ok' : 'c-bad') : '') +
        '</div></div>';
    });
    return html + '</div></section>';
  }

  function secAnual(d) {
    var a = d.anual, y = a.anio, max = a.max || 1, inflPct = Math.round(a.inflacion * 1000) / 10;
    function h(v) { return v != null ? Math.max(0, Math.min(100, v / max * 100)) : 0; }
    function clase(v) { return v == null ? '' : v >= 0 ? 'c-ok' : 'c-bad'; }
    var html = '<section class="tarjeta" id="sec-anual" aria-labelledby="t-anual"><div class="titulo-sec"><h2 id="t-anual">Facturación mensual · ' + (y - 1) + ' vs. ' + y + '</h2>' +
      '<label class="infl">Inflación ' + (y - 1) + ' → ' + y + ' <input id="inp-infl" type="number" step="0.5" min="0" value="' + inflPct + '" aria-label="Inflación en porcentaje"> %</label></div>' +
      '<div class="leyenda" style="justify-content:flex-start;gap:18px">' +
      '<span><span class="sw" style="background:var(--acento-claro)"></span>' + (y - 1) + '</span>' +
      '<span><span class="sw" style="background:var(--ambar)"></span>' + (y - 1) + ' ajustado (+' + nf1.format(inflPct) + '%)</span>' +
      '<span><span class="sw" style="background:var(--acento)"></span>' + y + '</span>' +
      (d.esActual ? '<span><span class="sw" style="border:2px dashed var(--acento);width:12px;height:12px"></span>Proyección mes en curso</span>' : '') + '</div>';
    var barras = '', etis = '', vN = '', vR = '';
    a.meses.forEach(function (m) {
      var tip = m.nombre + ' — ' + (y - 1) + ': ' + fmt(m.anterior) + ' · ' + (y - 1) + ' ajustado: ' + fmt(m.ajustado) + ' · ' + y + ': ' + fmt(m.actual) +
        (m.estado === 'encurso' ? ' (en curso, proyección ' + fmt(m.proyeccion) + ')' : '') +
        (m.varNominal != null ? ' · vs ' + (y - 1) + ': ' + VAR(m.varNominal) : '') +
        (m.varReal != null ? ' · real: ' + VAR(m.varReal) : '');
      var actual = m.estado === 'encurso'
        ? '<div class="pila">' + (m.proyeccion != null ? '<div class="proy" style="height:' + h(m.proyeccion) + '%"></div>' : '') +
          '<div class="b act" style="height:' + h(m.actual) + '%"></div></div>'
        : '<div class="b act" style="height:' + h(m.actual) + '%"></div>';
      barras += '<div class="mes" title="' + esc(tip) + '"><div class="b ant" style="height:' + h(m.anterior) + '%"></div>' +
        '<div class="b aj" style="height:' + h(m.ajustado) + '%"></div>' + actual + '</div>';
      etis += '<span>' + m.corto + '</span>';
      vN += '<span class="' + clase(m.varNominal) + '">' + (m.varNominal == null ? '' : VAR(m.varNominal)) + '</span>';
      vR += '<span class="' + clase(m.varReal) + '">' + (m.varReal == null ? '' : VAR(m.varReal)) + '</span>';
    });
    html += '<div class="graf-scroll"><div class="graf graf3" role="img" aria-label="Facturación por mes: ' + (y - 1) + ', ' + (y - 1) + ' ajustado e ' + y + '">' +
      '<div class="barras">' + barras + '</div><div class="etis">' + etis + '</div>' +
      '<div class="vars"><em>vs ' + (y - 1) + '</em>' + vN + '</div>' +
      '<div class="vars"><em>Real</em>' + vR + '</div></div></div>';
    if (!a.hayAnterior) {
      html += '<p class="vacio" style="margin:0">Cargá la facturación de ' + (y - 1) + ' en la pestaña Facturación de VentasTrack (una fila por mes, con Año = ' + (y - 1) + ') para ver la comparación.</p>';
    } else if (a.cerrados) {
      html += '<div class="chips">' +
        chip('Meses cerrados ' + y, fmt(a.ytdActual)) +
        chip((y - 1) + ' mismos meses', fmt(a.ytdAnterior)) +
        chip('Variación nominal', VAR(a.varNominal), clase(a.varNominal)) +
        chip((y - 1) + ' ajustado', fmt(a.ytdAjustado)) +
        chip('Variación real', VAR(a.varReal), clase(a.varReal)) +
        '</div><span class="k-sub">"Real" compara contra ' + (y - 1) + ' ajustado por la inflación cargada. Pasá el mouse por cada mes para ver los importes.</span>';
    }
    return html + '</section>';
  }

  var COLORES_TRAMO = ['#C6F432', '#4FD1C5', '#FFB547', '#FF8A7A', '#FF5A4E'];
  function colorTramo(i, n) { return n <= 1 ? COLORES_TRAMO[0] : COLORES_TRAMO[Math.round(i * (Math.min(n, 5) - 1) / (n - 1))]; }

  function secFinanciera(d) {
    var b = d.balance, v = d.vencimientos;
    var html = '<section class="sec-fin" aria-labelledby="t-fin"><div class="titulo-sec"><h2 id="t-fin">Situación financiera</h2>' +
      (b ? '<span class="nota">Saldos al ' + F(b.fecha, true) + '</span>' : '') + '</div>';
    if (!b) return html + '<div class="tarjeta"><p class="vacio" style="margin:0">No hay datos en la pestaña BALANCE.</p></div></section>';

    html += '<div class="fila">' +
      '<div class="mini"><span class="rot">Stock a valor compra</span><span class="num n30">' + M(b.stock) + '</span></div>' +
      '<div class="mini"><span class="rot">Deuda en la calle</span><span class="num n30">' + M(b.calle) + '</span></div>' +
      '<div class="mini"><span class="rot">Deuda con proveedores</span><span class="num n30">' + M(b.proveedores) + '</span></div></div>';

    if (v) {
      var n = v.tramos.length;
      html += '<div class="tarjeta" style="padding:24px 28px;gap:18px"><div class="titulo-sec"><h3 style="font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase">Deuda en la calle por antigüedad</h3>' +
        '<span class="nota">Total ' + M(v.total) + (v.fecha.key !== b.fecha.key ? ' · al ' + F(v.fecha, true) : '') + '</span></div>' +
        '<div class="tramos-barra" role="img" aria-label="Deuda por antigüedad">' +
        v.tramos.map(function (t, i) { return t.valor > 0 ? '<div style="width:' + pc(t.pct) + '%;background:' + colorTramo(i, n) + '"></div>' : ''; }).join('') +
        '</div><div class="fila">' +
        v.tramos.map(function (t, i) {
          var ult = i === n - 1;
          return '<div class="tramo" style="border-top-color:' + colorTramo(i, n) + '"><span class="rot' + (ult ? ' neg' : '') + '"' + (ult ? ' style="font-weight:600"' : '') + '>' + esc(t.label) + '</span>' +
            '<span class="num n24">' + M(t.valor) + '</span><span class="sub">' + P(t.pct) + ' del total</span></div>';
        }).join('') + '</div>' +
        (v.coincide === false ? '<div class="aviso">El total por tramos (' + M(v.total) + ') no coincide con Cuentas a cobrar del balance (' + M(b.calle) + ').</div>' : '') +
        '</div>';
    }

    function tabla(lado, titulo, total) {
      return '<div class="tabla"><div class="enc">' + titulo + '</div>' +
        b.items.filter(function (x) { return x.lado === lado; }).map(function (x) {
          return '<div class="reng"><span>' + esc(x.label) + (x.acido ? '<span class="tag">entra en ácido</span>' : '') + '</span><span class="num">' + M(x.valor) + '</span></div>';
        }).join('') +
        '<div class="tot"><span>Total ' + lado + '</span><span class="num">' + M(total) + '</span></div></div>';
    }
    html += '<div class="fila">' + tabla('activo', 'Activo', b.totalActivo) + tabla('pasivo', 'Pasivo', b.totalPasivo) + '</div>';

    html += '<div class="fila">' +
      '<div class="bal"><div class="cab"><span>Balance</span>' + (b.balance >= 0 ? etiqueta('ok', 'Positivo') : etiqueta('bad', 'Negativo')) + '</div>' +
      '<span class="num n38' + (b.balance < 0 ? ' rojo' : '') + '">' + M(b.balance) + '</span>' +
      '<span class="sub">Total activo − Total pasivo</span>' +
      '<span class="sub">Cobertura <b class="mono" style="color:var(--tinta)">' + X(b.balanceIdx) + '</b> veces el pasivo</span></div>' +
      '<div class="bal"><div class="cab"><span>Balance ácido</span>' + (b.acido >= 0 ? etiqueta('ok', 'Positivo') : etiqueta('bad', 'Negativo')) + '</div>' +
      '<span class="num n38' + (b.acido < 0 ? ' rojo' : '') + '">' + M(b.acido) + '</span>' +
      '<span class="sub">(Caja y bancos + Ch. en cartera + Cuentas a cobrar) − (Proveedores + Ch. propio pendiente)</span>' +
      '<span class="sub"><b class="mono" style="color:var(--tinta)">' + M(b.acidoActivo) + '</b> líquido contra <b class="mono" style="color:var(--tinta)">' + M(b.acidoPasivo) + '</b> de deuda inmediata · cobertura <b class="mono" style="color:var(--tinta)">' + X(b.acidoIdx) + '</b> veces</span></div>' +
      '</div>';
    return html + '</section>';
  }

  function cabecera(d) {
    var opciones = d ? d.meses.map(function (m) {
      var p = m.split('-');
      return '<option value="' + m + '"' + (m === d.mes ? ' selected' : '') + '>' + C.MESES[+p[1] - 1] + ' ' + p[0] + '</option>';
    }).join('') : '';
    var hoy = new Date();
    return '<header class="cabecera"><div><div class="sup">Control de gestión</div><h1>' + esc(CFG.titulo || 'Tablero de Comando') + '</h1></div>' +
      '<div class="controles">' +
      (d ? '<span>' + (d.esActual ? 'Hoy ' + F({ d: hoy.getDate(), m: hoy.getMonth() + 1, y: hoy.getFullYear() }, true) : 'Período cerrado') + '</span>' : '') +
      (d ? '<span class="pastilla">Día hábil ' + d.transcurridos + ' de ' + d.totalDias + '</span>' : '') +
      (d ? '<label><span style="position:absolute;left:-9999px">Mes</span><select id="sel-mes">' + opciones + '</select></label>' : '') +
      '<button type="button" id="btn-act">Actualizar</button></div></header>';
  }

  // Inflación para la comparativa: la que se cargó en el gráfico (guardada en este navegador) o la de la configuración.
  function inflacionGuardada() {
    try { var v = localStorage.getItem('tablero.inflacion'); if (v != null && v !== '' && isFinite(+v)) return +v; } catch (e) {}
    return +CFG.inflacion || 0;
  }
  estado.inflacion = inflacionGuardada();

  function modelo() {
    return C.calcular(estado.tablas, estado.mes, { puntoEquilibrio: CFG.puntoEquilibrio, inflacion: estado.inflacion / 100 });
  }

  function enlazarInflacion() {
    var inp = document.getElementById('inp-infl');
    if (!inp) return;
    inp.addEventListener('change', function () {
      var v = parseFloat(String(inp.value).replace(',', '.'));
      if (!isFinite(v) || v < 0) v = 0;
      estado.inflacion = v;
      try { localStorage.setItem('tablero.inflacion', String(v)); } catch (e) {}
      var sec = document.getElementById('sec-anual');
      if (sec) { sec.outerHTML = secAnual(modelo()); enlazarInflacion(); }
    });
  }

  function dibujar() {
    var html = '', d = null;
    if (estado.error) {
      html = cabecera(null) + '<div class="error"><b>No se pudieron cargar los datos.</b><span>' + esc(estado.error) + '</span>' +
        '<span class="sub">Si el problema sigue, revisá que las pestañas estén publicadas en la web como CSV.</span></div>';
    } else if (!estado.tablas) {
      html = '<div class="vacio">Cargando datos…</div>';
    } else {
      try {
        d = modelo();
        estado.mes = d.mes;
        var avisos = estado.avisos.concat(d.avisos);
        html = cabecera(d) +
          (avisos.length ? '<div class="aviso">' + avisos.map(esc).join('<br>') + '</div>' : '') +
          secEmpresa(d) + secFacturable(d) + secFacturacion(d) + secAnual(d) + secFinanciera(d) +
          '<p class="pie">Ventas, objetivos y facturación: VentasTrack · Situación financiera: planilla del tablero' +
          (estado.leido ? ' · Leído a las ' + hora(estado.leido) : '') + '</p>';
      } catch (e) {
        html = cabecera(null) + '<div class="error"><b>Hay un problema con los datos.</b><span>' + esc(e.message) + '</span></div>';
      }
    }
    app.innerHTML = html;
    var sel = document.getElementById('sel-mes');
    if (sel) sel.addEventListener('change', function () { estado.mes = sel.value; dibujar(); });
    var btn = document.getElementById('btn-act');
    if (btn) btn.addEventListener('click', function () { btn.disabled = true; btn.textContent = 'Actualizando…'; cargar(); });
    enlazarInflacion();
  }

  cargar();
  var min = +CFG.refrescoMinutos;
  if (min > 0) setInterval(cargar, min * 60000);
})();
  </script>
</body>
</html>
